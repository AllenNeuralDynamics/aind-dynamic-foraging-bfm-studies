name: CI

# Offline regeneration check (posthoc-reporting: reports are code). Every study's
# `make all` must reproduce the committed artifacts from the committed frozen inputs,
# with no W&B, Beaker or cluster access; `_meta` blocks, float noise and image bytes are
# allowed to differ, anything else fails. Credentialed producers (`freeze-*`, `pull-*`)
# are never CI prerequisites.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  file-sizes:
    # fast gate: a large file merged into main stays in history for good (main refuses force-push)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # every incoming commit, not just the merge result
      - name: No file over 10 MiB outside the allowlist, in the tree or in any incoming commit
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/check_file_sizes.py --range "origin/${{ github.base_ref }}..HEAD"
          else
            python3 scripts/check_file_sizes.py
          fi

  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Unit tests (shared study helpers, launcher-record contract)
        run: python -m unittest discover -s tests -t . -v

      - name: Study 09 sweeps inline their current source manifests
        run: python studies/09-gru-cross-species-transfer/sync_transfer_sweeps.py --check

      - name: Regenerate every study and compare with HEAD
        env:
          WANDB_MODE: disabled
          MPLBACKEND: Agg
        run: python scripts/check_regeneration.py
