# Study directory layout, read by scripts/check_provenance.py.
#
# Principle: enforce what tools read, leave the rest to the scientist. Anything the validator,
# the atlas, the launchers or CI parse has a fixed place. Inside analysis/ placement is free,
# because an artifact's provenance lives in its `_meta` digests, not in its path.
schema_version: 1

study:
  name_pattern: '^(?P<number>[0-9]{2})-(?P<model>[a-z0-9]+)-(?P<purpose>[a-z0-9]+(-[a-z0-9]+)*)$'
  required: [README.md, Makefile, CHANGELOG.md, analysis/, variants/]
  # Root allowlist. Anything else at the study root (code, data, figures, launch records) is a
  # finding: code goes under analysis/ or a variant, launch records under a variant.
  allowed: [README.md, Makefile, CHANGELOG.md, .gitignore, environment.lock, analysis/, variants/, reference/]
  allowed_patterns: ['^[A-Z][A-Z0-9_]*\.md$']   # PLAN.md, FUTURE_DIRECTIONS.md, ...
  # environment.lock pins the env of credentialed freezes, which CI cannot rerun.
  environment_lock_required_when: has_freeze

makefile:
  required_targets: [all]
  per_report_target: 'r{n}'      # every analysis/reports/rN-*.md
  per_freeze_target: '^freeze(-[\w-]+)?$'   # at least one when the study has a freeze

variant:
  name_pattern: '^[a-z0-9]+([._-][a-z0-9]+)*$'
  required: [notes.md]
  launch_record_dir: launch_record     # exactly one; subdirectories inside it are fine
  required_after_launch: [launch_record/]

analysis:
  reports_dir: analysis/reports
  report_name_pattern: '^r(?P<n>[0-9]+)-(?P<slug>[a-z0-9]+(-[a-z0-9]+)*)\.md$'
  index: analysis/reports/INDEX.md     # must link every report
  # Gitignored, never an input; matched against every path component.
  cache_pattern: 'cache'
