# The held-out fine-tune of study 02's H256 / D614 / seed 0 3-way GRU
# (AIND-disRNN/mice_ignore_scaling run nxd-3way-20260707-075401-80a6d102), redone offline.
#
# Generated by the wrapper's resume_heldout_beaker._build_finetune_config (imported only; that
# script's main() resumes and overwrites the study 02 run and is never run) from the source run's
# own W&B config, so every knob is the one the run's end-of-training auto_heldout_finetune used.
# Changes: source_run.model_dir and output.output_root are set per launch by run_hpc.sbatch, and
# `wandb: {}` keeps the job off W&B (upload_wandb.py logs the result after the reproduction check).
#
# The all-null selectors inherit the held-out cohort from the source run's inputs.yaml, whose data
# config pins snapshot 20260603 (every 5th ranked subject, min 10 sessions, the three curricula).
# best_eval resolves to the final checkpoint, step 90000: eval likelihood rose at every checkpoint.
source_run:
  model_dir: /prior/run
  checkpoint_policy: best_eval
heldout_subjects:
  test_subject_ids: null
  curricula: null
  min_sessions: null
  heldout_every_n: null
  mature_only: null
  cols_to_retain: null
heldout_finetuning:
  n_steps: 500
  lr: 0.001
  checkpoint_every_n_steps: 100
  batch_size: null
  batch_mode: single
  keep_media_files: true
  checkpoint_plot_split_examples_every_n: 100
  checkpoint_save_output_df_every_n: 0
  train_example_sessions_per_subject: 1
  eval_example_sessions_per_subject: 1
  example_max_subjects: 1
output:
  output_root: /results/heldout
  run_name_suffix: null
wandb: {}
seed: null
