# Rescore of the 46 subjects that were refit: the centred refit (sweep_hpc_refit.yaml) was worse on
# every gate and is not used (ADR 0004), so these subjects keep their production fit too. Same
# command as sweep_hpc_rescore.yaml: saved production draws scored again (plain scores reproduce
# production exactly), sessions failing Pareto k-hat rescored by importance sampling.
# Generated by make_refit_rescore.py from analysis/hattori_runs.json; do not edit by hand.
entity: AIND-disRNN
project: mice_data_scaling
name: hb-heldout-two-level-rescore-refit-subjects

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=hb_hattori
  - model.estimator=heldout_two_level
  - model.num_warmup=2000
  - model.num_samples=1500
  - model.num_chains=4
  - +model.session_draws_per_posterior_draw=24
  - +model.draws_path=/home/han.hou/code/wt/hpc13c/aind-dynamic-foraging-bfm-studies/studies/13-hb-subject-vs-gru-heldout/variants/hattori/draws_index.json
  - +model.importance_rescore=true
  - +model.importance_draws=24000
  - data.subject_ratio=0.016
  - seed=0
  - wandb.entity=AIND-disRNN
  - wandb.project=mice_data_scaling
  - ${args_no_hyphens}

parameters:
  data.test_subject_ids:
