# Second refit (non-centred), approved by Han on 2026-10-28 after the centred refit was worse on
# every gate (ADR 0004): the same 46 subjects, production's non-centred session level, target
# acceptance 0.95, 3000 warmup + 4 x 3000 draws (12,000 posterior draws), 12 session draws per
# posterior draw (144,000 per session-marginal, as in production). Sessions failing Pareto k-hat are
# rescored by importance sampling.
# Generated by make_refit_rescore.py from analysis/hattori_runs.json; do not edit by hand.
entity: AIND-disRNN
project: mice_data_scaling
name: hb-heldout-two-level-refit-noncentred

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=hb_hattori
  - model.estimator=heldout_two_level
  - model.num_warmup=3000
  - model.num_samples=3000
  - model.num_chains=4
  - model.target_accept_prob=0.95
  - +model.session_draws_per_posterior_draw=12
  - +model.importance_rescore=true
  - +model.importance_draws=24000
  - data.subject_ratio=0.016
  - seed=0
  - wandb.entity=AIND-disRNN
  - wandb.project=mice_data_scaling
  - ${args_no_hyphens}

parameters:
  data.test_subject_ids:
