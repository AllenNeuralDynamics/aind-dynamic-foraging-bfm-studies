# ctt refit: the subjects failing a gate in ctt@20261028-003745, refit as the hattori
# variant's (ADR 0004): non-centred, target acceptance 0.95, 3000 warmup + 4 x 3000 draws,
# 12 session draws per posterior draw; k-hat rescue on.
# Generated by make_refit.py from analysis/ctt_runs.json; do not edit by hand.
entity: AIND-disRNN
project: mice_data_scaling
name: hb-ctt-heldout-two-level-refit

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=hb_hattori
  - model.estimator=heldout_two_level
  - model.num_warmup=3000
  - model.num_samples=3000
  - model.target_accept_prob=0.95
  - model.num_chains=4
  - +model.session_draws_per_posterior_draw=12
  - +model.hb_model=ctt
  - +model.importance_rescore=true
  - +model.importance_draws=24000
  - data.subject_ratio=0.016
  - seed=0
  - wandb.entity=AIND-disRNN
  - wandb.project=mice_data_scaling
  - ${args_no_hyphens}

