version: v2
description: 'gru-heldout-replay: study 01 v1 D=614 GRU, offline held-out fine-tune
  per seed'
tasks:
- name: gru-heldout-replay-s0
  image:
    beaker: han-hou/dynamic-foraging-bfm-wrapper-main-20260902
  command:
  - bash
  - /workspace/aind-dynamic-foraging-bfm-wrapper/beaker/entrypoint.sh
  - bash
  - -lc
  - python -c "import base64;open('/tmp/heldout.yaml','wb').write(base64.b64decode(''))"
    && python -m run_analysis finetune --config /tmp/heldout.yaml
  context:
    priority: low
    preemptible: true
  constraints:
    cluster:
    - ai1/octo-hub-onprem-h200
  resources:
    gpuCount: 1
    cpuCount: 12
    memory: 90GiB
  datasets:
  - mountPath: /prior
    source:
      beaker: 01KVQ7EKECRXB4YVWQKK0N73KM
  envVars:
  - name: WRAPPER_REF
    value: 5affee531856d6eff31c9285e981c93747699efc
  - name: DISPATCHER_REF
    value: 68041b2b0ef2c6a37a6f710a4fb6b7dc92d68f64
  - name: FORAGING_MODELS_REF
    value: 286692dd076fe6203c0fcf096c06fe37552e49da
  result:
    path: /results
