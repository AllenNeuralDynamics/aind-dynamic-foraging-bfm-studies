version: v2
description: Study 10 H128 D614 E4 frozen-random GRU reservoir
tasks:
  - name: study10-reservoir
    image:
      beaker: han-hou/dynamic-foraging-bfm-wrapper-main-20260902
    command:
      - bash
      - /workspace/aind-dynamic-foraging-bfm-wrapper/beaker/entrypoint.sh
      - bash
      - -c
      - 'echo "Launcher-only template: use code/launch_beaker_resumable.py" >&2; exit 2'
    context:
      priority: normal
      preemptible: false
    constraints:
      cluster:
        - ai1/octo-hub-onprem-h200
    resources:
      gpuCount: 1
      cpuCount: 12
      memory: 90GiB
    envVars:
      - name: WANDB_API_KEY
        secret: han-wandb-api-key
      - name: WRAPPER_REF
        value: 847a270945a29a0ce6ab78c89df660d084c7be95
      - name: DISPATCHER_REF
        value: study/10-reservoir-ablation
      - name: FORAGING_MODELS_REF
        value: 459c05c38332eb5c954e7cbca328f0a0fe370891
    result:
      path: /results
