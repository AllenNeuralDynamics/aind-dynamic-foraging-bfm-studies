<script>
"use strict";
// BEGIN REFS
const REFS = {
 "chance": 0.5,
 "mle_ctt": 0.717,
 "hb_ctt": 0.7225,
 "gru_v2_h128": 0.7282,
 "n_train_mice": 614,
 "n_test_mice": 149,
 "n_test_sessions": 2138,
 "n_test_trials": 1013172,
 "sources": [
  {
   "value": "mle_ctt",
   "file": "studies/01-gru-scaling-law/analysis/rl_baseline.json",
   "produced_at_pt": "2026-10-24T03:15:30-07:00"
  },
  {
   "value": "hb_ctt, n_test_sessions, n_test_trials",
   "file": "studies/13-hb-subject-vs-gru-heldout/analysis/r5_ctt_pooled.json",

  },
  {
   "value": "gru_v2_h128",

   "produced_at_pt": "2026-09-01T13:55:57-07:00"
  },
  {
   "value": "n_train_mice, n_test_mice",
   "file": "studies/10-gru-reservoir-ablation/reference/study01-v2-exact-split.json"
  }
 ]
};
// END REFS

const C = document.getElementById("c"), X = C.getContext("2d");
const W = C.width, H = C.height;
const COL = { bg: "#14171f", ink: "#e8e6e3", dim: "#8a8f98", blue: "#58c4dd", yellow: "#ffd866",
              red: "#fc6255", green: "#83c167", purple: "#9a72ac", grey: "#5a5f6a", panel: "#1b1f29",
              edge: "#2c3240" };
const SANS = "-apple-system, Segoe UI, Helvetica, Arial, sans-serif";
const MONO = "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";

// ---------- small math helpers ----------
let seed = 7;
function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
function randn() { let u = 0, v = 0; while (u === 0) u = rnd(); v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const sig = x => 1 / (1 + Math.exp(-x));
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = t => Math.max(0, Math.min(1, t));
function seg(t, a, b) { return ease((t - a) / (b - a)); }   // eased progress of t within [a, b]
const fmt4 = v => v.toFixed(4);

// ---------- drawing helpers ----------
function clear() { X.fillStyle = COL.bg; X.fillRect(0, 0, W, H); }
function text(s, x, y, o = {}) {
  X.save(); X.globalAlpha = o.a ?? 1; X.fillStyle = o.c || COL.ink;
  X.font = `${o.w || 400} ${o.size || 16}px ${o.mono ? MONO : SANS}`;
  X.textAlign = o.align || "left"; X.textBaseline = o.base || "alphabetic"; X.fillText(s, x, y); X.restore();
}
function line(x1, y1, x2, y2, c, w = 1.5, a = 1, dash) {
  X.save(); X.globalAlpha = a; X.strokeStyle = c; X.lineWidth = w; if (dash) X.setLineDash(dash);
  X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2, y2); X.stroke(); X.restore();
}
function poly(pts, c, w = 2, a = 1, dash) {
  if (pts.length < 2) return;
  X.save(); X.globalAlpha = a; X.strokeStyle = c; X.lineWidth = w; if (dash) X.setLineDash(dash);
  X.beginPath(); pts.forEach(([x, y], i) => i ? X.lineTo(x, y) : X.moveTo(x, y)); X.stroke(); X.restore();
}
function dot(x, y, r, c, a = 1) { X.save(); X.globalAlpha = a; X.fillStyle = c; X.beginPath();
  X.arc(x, y, Math.max(0, r), 0, 2 * Math.PI); X.fill(); X.restore(); }
function ring(x, y, r, c, a = 1, w = 1.5) { X.save(); X.globalAlpha = a; X.strokeStyle = c; X.lineWidth = w;
  X.beginPath(); X.arc(x, y, Math.max(0, r), 0, 2 * Math.PI); X.stroke(); X.restore(); }
function box(x, y, w, h, o = {}) {
  X.save(); X.globalAlpha = o.a ?? 1; const r = o.r ?? 8;
  X.beginPath(); X.roundRect(x, y, w, h, r);
  if (o.fill) { X.fillStyle = o.fill; X.fill(); }
  if (o.stroke) { X.strokeStyle = o.stroke; X.lineWidth = o.lw || 1.5; if (o.dash) X.setLineDash(o.dash); X.stroke(); }
  if (o.glow) { X.shadowColor = o.glow; X.shadowBlur = 18 * (o.glowA ?? 1); X.strokeStyle = o.glow; X.lineWidth = 2; X.stroke(); }
  X.restore();
}
function arrow(x1, y1, x2, y2, c, a = 1, w = 1.8) {
  line(x1, y1, x2, y2, c, w, a);
  const ang = Math.atan2(y2 - y1, x2 - x1), s = 8;
  X.save(); X.globalAlpha = a; X.fillStyle = c; X.beginPath(); X.moveTo(x2, y2);
  X.lineTo(x2 - s * Math.cos(ang - 0.4), y2 - s * Math.sin(ang - 0.4));
  X.lineTo(x2 - s * Math.cos(ang + 0.4), y2 - s * Math.sin(ang + 0.4)); X.closePath(); X.fill(); X.restore();
}
function title(s, sub) { text(s, 32, 40, { size: 20, w: 600 }); if (sub) text(sub, W - 32, 40, { c: COL.dim, size: 13, align: "right" }); }

// ---------- toy world: one session of the two-port task ----------
// Coupled, baited block task; the toy mouse is the scene-2 program with fixed parameters.
const TOY_P = { alpha: 0.45, forget: 0.15, beta: 5.0 };
function programUpdate(q, choice, reward, p) {   // the same rule as the program typed in scene 2
  const out = q.slice(), other = 1 - choice;
  out[other] *= 1 - p.forget;
  out[choice] += p.alpha * (reward - out[choice]);
  return out;
}
function makeSession(sv, n) {
  seed = sv;
  const pairs = [[0.45, 0.05], [0.05, 0.45], [0.36, 0.14], [0.14, 0.36], [0.4, 0.1]];
  const blocks = [], trials = [];
  let t = 0, b = 0;
  while (t < n) { const len = 22 + Math.floor(rnd() * 18); blocks.push({ start: t, len, p: pairs[b % pairs.length] }); t += len; b++; }
  let q = [0, 0], bait = [false, false];
  for (let k = 0; k < n; k++) {
    const blk = blocks.find(B => k >= B.start && k < B.start + B.len);
    const [pL, pR] = blk.p;
    for (const i of [0, 1]) bait[i] = bait[i] || rnd() < [pL, pR][i];
    const pRight = sig(TOY_P.beta * (q[1] - q[0]));
    const choice = rnd() < pRight ? 1 : 0, reward = bait[choice] ? 1 : 0;
    bait[choice] = false;
    trials.push({ pL, pR, choice, reward, pRight, q: q.slice() });
    q = programUpdate(q, choice, reward, TOY_P);
  }
  return trials;
}
const SESSION = makeSession(5, 120);

// A session drawn the way the lab's plot_foraging_session draws it: block baiting probabilities as
// steps, choices as ticks (right above, left below), tall tick = rewarded. Right = blue, left = red.
function drawSession(S, n, bx, o = {}) {
  const { x, y, w, h } = bx, dx = w / S.length, top = y + 16, bot = y + h - 16;
  const py = p => bot - p * (bot - top);
  box(x, y - 22, w, h + 44, { fill: COL.panel, r: 8, a: o.a ?? 1 });
  const a = o.a ?? 1;
  line(x, py(0), x + w, py(0), COL.grey, 1, 0.5 * a);
  line(x, py(1), x + w, py(1), COL.grey, 1, 0.25 * a, [3, 4]);
  const stepR = [], stepL = [];
  for (let k = 0; k < n; k++) { const xs = x + k * dx; stepR.push([xs, py(S[k].pR)], [xs + dx, py(S[k].pR)]);
    stepL.push([xs, py(S[k].pL)], [xs + dx, py(S[k].pL)]); }
  poly(stepR, COL.blue, 2, 0.85 * a); poly(stepL, COL.red, 2, 0.85 * a);
  for (let k = 0; k < n; k++) {
    const T = S[k], xs = x + k * dx + dx / 2, len = T.reward ? 14 : 6;
    if (T.choice === 1) line(xs, y - 18, xs, y - 18 + len, COL.blue, 2, (T.reward ? 1 : 0.6) * a);
    else line(xs, y + h + 18, xs, y + h + 18 - len, COL.red, 2, (T.reward ? 1 : 0.6) * a);
  }
  if (o.fitted) { const pts = []; for (let k = 0; k < n; k++) pts.push([x + k * dx + dx / 2, py(S[k].pRight)]);
    poly(pts, COL.ink, 2, a); }
  if (o.cursor && n > 0 && n < S.length) line(x + n * dx, y - 20, x + n * dx, y + h + 20, COL.yellow, 1, 0.6 * a);
  return { py, dx };
}

// ---------- scenes ----------
const N_TRAIN = REFS ? REFS.n_train_mice : 614, N_TEST = REFS ? REFS.n_test_mice : 149;
const R = REFS || { chance: 0.5, mle_ctt: NaN, hb_ctt: NaN, gru_v2_h128: NaN };

const SCENES = [
  { name: "1 · A mouse at work", dur: 20, cap: () =>
    "A mouse chooses between two lick ports. On each trial, each port is <b>baited</b> (loaded with water) with a " +
    "probability that changes in <b>blocks</b> without warning (lines: blue = right port, red = left port). Water " +
    "at a port the mouse did not choose stays there until it is collected. Ticks show the choices: right above, " +
    "left below; a tall tick means water. To collect water the mouse must track which port is better now. " +
    `The data: <b>${N_TRAIN}</b> training mice and <b>${N_TEST}</b> held-out mice, many sessions each.`, draw: sceneMouse },
  { name: "2 · A model is a small program", dur: 25, cap: () =>
    "A cognitive model is a <b>small program</b> with three functions. <i class=t>init_latents</i> starts each " +
    "session, <i class=t>predict</i> turns the <b>latent variables</b> (here two Q values) into p(right), <i class=t>update</i> learns from the choice " +
    "and the water. The <b>parameters</b> (dials) are fitted to each mouse by our code; a program may have at most 8 of them " +
    "and 6 latent variables. The search asks Claude to write new programs: a new rule, a new latent variable, a new way to forget.", draw: sceneProgram },
  { name: "3 · Fit on even, score on odd", dur: 35, cap: () =>
    "Per mouse, sessions in date order, counted from 0: <b>even sessions</b> (0, 2, 4, …) fit the parameters, " +
    "<b>odd sessions</b> (1, 3, 5, …) are scored. " +
    "Each session gets its own dial setting, pulled toward the mouse's typical value (the <b>session level</b>, " +
    "as in study 13). To score a held-out session, many candidate settings are <b>reweighted</b> by how well " +
    "they explain its earlier trials. The score is exp(mean log p) over all scored trials. " +
    "The gap to close runs from HB-CTT to the GRU.", draw: sceneFit },
  { name: "4 · One round of the search", dur: 45, cap: () =>
    "ShinkaEvolve keeps programs on five <b>islands</b>, each started from its own <b>seed</b>: a near-empty " +
    "template, the three best literature models, and Eckstein's Bayesian-inference model (or the fourth best). " +
    "Each round it picks a <b>parent</b> and an <b>inspiration</b>, builds a prompt (the task card is cached, so it " +
    "is cheap to resend), and Claude writes a <b>child</b>. A quick screen stops a broken child and returns its " +
    "error as feedback; a full fit scores the survivor on the validation mice. Programs migrate between islands, " +
    "and every tenth generation a short \"what worked\" note joins the prompt. Toy numbers.", draw: sceneSearch },
  { name: "5 · Four groups of mice, then gates", dur: 25, cap: () =>
    "Four groups that never mix. <b>Generation</b> mice give the feedback that Claude reads. <b>Validation</b> " +
    "mice give the score that ranks programs. <b>Selection</b> mice are used once, to choose the four final " +
    `programs. The <b>${N_TEST} test</b> mice stay locked and are scored once, at the end. Before real money is ` +
    "spent, the <b>gates</b> must pass in order. Then the search: about $450.", draw: sceneGroups },
  { name: "6 · What comes out", dur: 25, cap: () =>
    "Stage 2 <b>simplifies</b> the best program at three <b>floors</b>: keep 90%, 75% or 50% of its gain over " +
    "the best literature model. Four programs (the best, and one per floor) are chosen in advance on the selection " +
    "mice. The headline is each one's <b>gap closed</b> on the test mice shared with the GRU. A good model must " +
    "also <b>behave</b> like a mouse, in replay and when it runs the task, at least as well as the best literature " +
    "model. Its per-trial latent variables are exported for later joins. An illustration, not a result.", draw: sceneOutcome },
];

// Scene 1: two ports, then a session drawn trial by trial.
function sceneMouse(t) {
  clear();
  title("A mouse at work", "toy session");
  const n = Math.min(SESSION.length, Math.floor(Math.max(0, t - 1) * 9));
  // the mouse and its two ports
  const mx = 92, my = 260, cur = SESSION[Math.max(0, n - 1)];
  text("left", mx - 34, 140, { c: COL.red, size: 13, align: "center" });
  text("right", mx + 34, 140, { c: COL.blue, size: 13, align: "center" });
  [-1, 1].forEach(s => { const c = s < 0 ? COL.red : COL.blue, on = n > 0 && n < SESSION.length && cur.choice === (s > 0 ? 1 : 0);
    box(mx + s * 34 - 6, 150, 12, 46, { fill: c, a: on ? 1 : 0.45, r: 4 }); });
  if (n > 0 && n < SESSION.length && cur.reward) dot(mx + (cur.choice ? 34 : -34), 206, 5, COL.ink, 0.9);
  dot(mx, my, 38, "#2a2f3c"); dot(mx - 30, my - 30, 13, "#2a2f3c"); dot(mx + 30, my - 30, 13, "#2a2f3c");
  dot(mx - 12, my - 8, 3.5, COL.ink); dot(mx + 12, my - 8, 3.5, COL.ink); dot(mx, my + 10, 4, "#c9a3a0");
  text(n ? `trial ${n}` : "", mx, 330, { c: COL.dim, size: 13, align: "center" });
  // the session
  drawSession(SESSION, n, { x: 200, y: 110, w: 720, h: 200 });
  text("baiting probability, right", 210, 352, { c: COL.blue, size: 13 });
  text("baiting probability, left", 400, 352, { c: COL.red, size: 13 });
  text("tall tick = water collected", 590, 352, { c: COL.dim, size: 13 });
  text("right choices", 920, 80, { c: COL.blue, size: 12, align: "right" });
  text("left choices", 920, 352, { c: COL.red, size: 12, align: "right" });
  const a = seg(t, 14, 16);
  if (a > 0) {
    text(`${N_TRAIN}`, 300, 412, { c: COL.yellow, size: 30, w: 600, align: "right", a });
    text("training mice", 310, 410, { size: 16, a });
    text(`${N_TEST}`, 640, 412, { c: COL.yellow, size: 30, w: 600, align: "right", a });
    text("held-out mice, the test set", 650, 410, { size: 16, a });
  }
}

// Scene 2: the program types itself in, then runs on the toy session.
const CODE = [
  ['PARAMS = {"alpha": (0, 1), "forget": (0, 1),', 0],
  ['          "beta": (0, 20)}', 0],
  ['LATENT_NAMES = ("q_left", "q_right")', 0],
  ['def init_latents(p, session):', 1], ['    return jnp.zeros(2)', 1],
  ['def predict(q, p):', 2], ['    return p["beta"] * q      # logits', 2],
  ['def update(q, choice, reward, p):', 3], ['    q = q.at[1 - choice].mul(1 - p["forget"])', 3],
  ['    return q.at[choice].add(p["alpha"] * (reward - q[choice]))', 3],
];
function drawCode(chars, x, y, hl, size = 12.5) {
  let left = chars;
  CODE.forEach(([s, fn], i) => {
    const yy = y + i * 21;
    if (hl && hl === fn) box(x - 6, yy - 14, 484, 20, { fill: "#2a3040", r: 4 });
    const shown = s.slice(0, Math.max(0, left)); left -= s.length;
    const isDef = s.startsWith("def ");
    text(shown, x, yy, { mono: true, size, c: isDef ? COL.green : s.startsWith("PARAMS") || s.startsWith("LATENT") || s.startsWith("   ") && i < 2 ? COL.purple : COL.ink });
  });
}
function dial(cx, cy, r, v, label, val, a = 1) {
  X.save(); X.globalAlpha = a; X.strokeStyle = COL.grey; X.lineWidth = 5;
  X.beginPath(); X.arc(cx, cy, r, Math.PI * 0.75, Math.PI * 2.25); X.stroke();
  X.strokeStyle = COL.yellow; X.beginPath(); X.arc(cx, cy, r, Math.PI * 0.75, Math.PI * (0.75 + 1.5 * v)); X.stroke(); X.restore();
  const ang = Math.PI * (0.75 + 1.5 * v);
  line(cx, cy, cx + (r - 8) * Math.cos(ang), cy + (r - 8) * Math.sin(ang), COL.ink, 2, a);
  text(label, cx, cy + r + 16, { size: 13, align: "center", a });
  text(val, cx, cy + r + 32, { size: 12, c: COL.dim, align: "center", a, mono: true });
}
function sceneProgram(t) {
  clear();
  title("A model is a small program", "toy parameters");
  box(24, 62, 500, 238, { fill: COL.panel, r: 8 });
  const total = CODE.reduce((s, [l]) => s + l.length, 0);
  const chars = Math.floor(total * seg(t, 0.3, 8));
  const n = Math.min(SESSION.length, Math.floor(Math.max(0, t - 9) * 8));
  drawCode(chars, 36, 88, n > 0 && n < SESSION.length ? (Math.floor(t * 4) % 2 ? 2 : 3) : 0);
  // latent-variable bars
  const S = SESSION[Math.min(n, SESSION.length - 1)], q = n ? S.q : [0, 0];
  const bx = 556, by = 230, bh = 140;
  text("latent variables", bx, 82, { c: COL.dim, size: 13 });
  [["q_left", q[0], COL.red], ["q_right", q[1], COL.blue]].forEach(([nm, v, c], i) => {
    const x = bx + i * 70; box(x, by - bh, 44, bh, { stroke: COL.edge, r: 4 });
    box(x, by - bh * clamp01(v), 44, bh * clamp01(v), { fill: c, r: 4, a: 0.9 });
    text(nm, x + 22, by + 18, { size: 12, align: "center", mono: true });
  });
  // dials
  const da = seg(t, 6, 8);
  text("parameters, fitted per mouse", 712, 82, { c: COL.dim, size: 13, a: da });
  dial(742, 140, 30, TOY_P.alpha, "alpha", TOY_P.alpha.toFixed(2), da);
  dial(818, 140, 30, TOY_P.forget, "forget", TOY_P.forget.toFixed(2), da);
  dial(894, 140, 30, TOY_P.beta / 20, "beta", TOY_P.beta.toFixed(1), da);
  // the session with the program's p(right)
  drawSession(SESSION, n, { x: 40, y: 352, w: 880, h: 70 }, { fitted: true, cursor: true });
  if (n > 0) text("white line: the program's p(right), trial by trial", 920, 324, { c: COL.dim, size: 12, align: "right" });
}

// Scene 3: tiles of sessions; session-level dial settings; in-session reweighting; the number line.
const STAGES = [COL.purple, COL.purple, COL.purple, COL.green, COL.green, COL.green, COL.green, COL.grey,
                COL.grey, COL.grey, COL.grey, COL.grey];
const STAGE_NAMES = [["early stage", COL.purple], ["later stage", COL.green], ["final stage", COL.grey]];
const FIT = (() => {
  seed = 23;
  const mu = 0.9, sd = 0.45, th = STAGES.map(() => mu + sd * randn());
  const K = 60, cand = []; for (let k = 0; k < K; k++) cand.push(mu + sd * 1.1 * randn());
  const trueTh = 1.45, ch = []; for (let i = 0; i < 40; i++) ch.push(rnd() < sig(trueTh) ? 1 : 0);
  // session marginal: predictive p(choice_t) = weighted mean over candidates, weights = lik(earlier trials)
  const logw = cand.map(() => 0), cum = [0], wHist = [cand.map(() => 1 / K)];

  seed = 91;
  const front = v => 0.1 + 0.85 * Math.sqrt(v), lit = 0.08, top = front(0.95);
  for (let i = 0; i < 40; i++) { const c = rnd();
    dot(xc(0.12 + 0.85 * c), yc(Math.min(0.97, front(c) * (0.75 + 0.25 * rnd()))), 2.5, COL.grey, aa); }
  poly([...Array(41).keys()].map(i => { const v = 0.08 + 0.89 * i / 40; return [xc(v), yc(front(v))]; }), COL.green, 1.5, 0.5 * aa);
  line(xc(0), yc(lit), xc(1), yc(lit), COL.dim, 1, aa, [2, 3]);
  text("best literature model", xc(1), yc(lit) - 5, { c: COL.dim, size: 11, align: "right", a: aa });
  dot(xc(0.95), yc(top), 7, COL.green, aa);
  text("best program", xc(0.95) - 12, yc(top) + 4, { c: COL.green, size: 12, align: "right", a: aa });
  [0.9, 0.75, 0.5].forEach((k, j) => {
    const f = lit + k * (top - lit), v = ((f - 0.1) / 0.85) ** 2, fa = seg(t, 1 + 2 * j, 2 + 2 * j);
    line(xc(0), yc(f), xc(1), yc(f), COL.yellow, 1, fa * aa, [5, 4]);
    text(`${k * 100}%`, xc(0) + 6, yc(f) - 3, { c: COL.yellow, size: 11, a: fa * aa });
    const sv = lerp(0.95, v, seg(t, 2 + 2 * j, 4 + 2 * j));
    if (fa > 0) dot(xc(sv), yc(front(sv)), 5, COL.yellow, fa * aa); });
  // B: where it lands on the test mice.
  const ba = seg(t, 7, 8);
  if (ba > 0) {
    text("2 · gap closed on the shared test mice", 500, ay0 + 6, { size: 13, w: 600, a: ba });
    const xv = numberLine(-10, 100, 150, { zoom: 1, a: ba, gap: false, notes: false, x0: 520, x1: 920 });
    const land = seg(t, 8.5, 11), v = lerp(R.hb_ctt, R.hb_ctt + 0.5 * (R.gru_v2_h128 - R.hb_ctt), land);
    X.save(); X.globalAlpha = 0.22 * ba; X.fillStyle = COL.yellow;
    X.fillRect(xv(R.hb_ctt), 140, xv(v) - xv(R.hb_ctt), 20); X.restore();
    dot(xv(v), lerp(90, 150, land), 7, COL.yellow, ba);
    text("program ?", xv(v), lerp(90, 150, land) - 12, { c: COL.yellow, size: 13, w: 600, align: "center", a: ba });
    text("gap closed = (program − HB-CTT) / (GRU − HB-CTT)", 720, 232, { c: COL.yellow, size: 13, align: "center", a: seg(t, 10, 11) });
  }
  // C: behaviour in closed loop with the task.
  const cx0 = 40, cy0 = 280, ca = seg(t, 13, 14);
  if (ca > 0) {
    text("3 · behaves like a mouse?", cx0, cy0, { size: 13, w: 600, a: ca });
    text("p(switch) after k unrewarded trials", cx0, cy0 + 18, { c: COL.dim, size: 12, a: ca });
    const px = k => cx0 + 30 + k * 62, pyy = v => cy0 + 150 - v * 190;
    line(px(0), pyy(0), px(5), pyy(0), COL.dim, 1, ca);
    const real = [0.08, 0.17, 0.27, 0.35, 0.41, 0.45], sim = [0.07, 0.18, 0.26, 0.36, 0.40, 0.47];
    poly(real.map((v, k) => [px(k), pyy(v)]), COL.ink, 2, ca); real.forEach((v, k) => dot(px(k), pyy(v), 4, COL.ink, ca));
    const sa = seg(t, 15, 16);
    poly(sim.map((v, k) => [px(k), pyy(v)]), COL.green, 2, sa, [6, 4]);
    for (let k = 0; k <= 5; k++) text(`${k}`, px(k), pyy(0) + 16, { c: COL.dim, size: 12, align: "center", a: ca });
    text("white: mice", px(0), cy0 + 40, { size: 12, a: ca });
    text("green dashed: the program running the task", px(0) + 80, cy0 + 40, { size: 12, c: COL.green, a: sa });
  }
  // D: latent exports for later joins.
  const dx0 = 500, dy0 = 280, da = seg(t, 18, 19);
  if (da > 0) {
    text("4 · per-trial latent variables, exported", dx0, dy0, { size: 13, w: 600, a: da });
    const n = Math.floor(SESSION.length * seg(t, 18.5, 22));
    const lx = k => dx0 + k * (250 / SESSION.length), ly = v => dy0 + 110 - v * 80;
    poly(SESSION.slice(0, n).map((s, k) => [lx(k), ly(s.q[0])]), COL.red, 1.8, da);
    poly(SESSION.slice(0, n).map((s, k) => [lx(k), ly(s.q[1])]), COL.blue, 1.8, da);
    text("q_left", dx0, dy0 + 134, { c: COL.red, size: 12, mono: true, a: da });
    text("q_right", dx0 + 60, dy0 + 134, { c: COL.blue, size: 12, mono: true, a: da });
    text("keyed by session_id and trial", dx0, dy0 + 152, { c: COL.dim, size: 12, a: da });
    const ea = seg(t, 21, 22);
    arrow(dx0 + 258, dy0 + 70, dx0 + 290, dy0 + 70, COL.dim, ea);
    ["metadata", "photometry", "Neuropixels"].forEach((s, k) => {
      box(dx0 + 298, dy0 + 22 + k * 34, 120, 26, { stroke: COL.edge, fill: COL.panel, a: ea, r: 6 });
      text(s, dx0 + 358, dy0 + 40 + k * 34, { size: 12, align: "center", a: ea }); });
    text("later rounds", dx0 + 358, dy0 + 140, { c: COL.dim, size: 12, align: "center", a: ea });
  }
}

// ---------- text version (screen readers, and anyone who prefers to read) ----------
// One entry per scene: what the canvas shows, with the same numbers. The canvas is labelled with
// its scene's name and described by the caption.
const f4 = v => Number.isFinite(v) ? v.toFixed(4) : "—";
const fmtN = v => REFS ? v.toLocaleString("en-US") : "—";
const TEXT = [
  `A toy session of the two-port task, 120 trials. Two stepped lines give each port's baiting probability ` +
  `in each block (for example 0.45 on the left and 0.05 on the right, then the reverse). Ticks above the panel ` +
  `are right choices and ticks below are left choices; a tall tick means water was collected. ` +
  `The data set has ${N_TRAIN} training-pool mice and ${N_TEST} held-out test mice.`,
  `A program types itself in:<pre>${CODE.map(([l]) => l).join("\n")}</pre>` +
  `Two bars show the latent variables q_left and q_right changing trial by trial. Three dials show the ` +
  `parameters: alpha ${TOY_P.alpha}, forget ${TOY_P.forget}, beta ${TOY_P.beta}. Below, the session is replayed ` +

  `"fit" and odd tiles "score". For the fit sessions, dots show each session's own setting of one dial θ around ` +
  `the mouse's typical value μ, inside a band of ± σ. For held-out session 5, 60 candidate settings are drawn; ` +
  `as its 40 trials arrive, settings that explain the earlier trials grow, and a counter accumulates log p(choice) ` +
  `and exp(mean log p). Last, a number line of held-out likelihood on the test mice: chance ${f4(R.chance)}, ` +
  `MLE CTT ${f4(R.mle_ctt)} (one parameter set per mouse, study 01), HB-CTT ${f4(R.hb_ctt)} (a parameter set per ` +
  `session, study 13), GRU ${f4(R.gru_v2_h128)} (study 01). The gap to close, from HB-CTT to the GRU, is ` +
  `${f4(R.gru_v2_h128 - R.hb_ctt)}.`,
  `Five islands, each titled by its seed program (template, literature #1 to #3, Eckstein or #4), with five ` +
  `program cards each and toy scores (100 × validation likelihood). A parent card (template island) and an ` +
  `inspiration card (literature #2 island) glow. The prompt fills with the cached task card, the parent ` +
  `program, its feedback split by stage and task, and the inspiration. Claude writes a child; its diff replaces ` +
  `"q = q.at[1-c].mul(1 - p['forget'])" with a forgetting rate gated by reward. A first child fails the quick ` +
  `screen (24 mice, at most 2 minutes) with NaN on the probe, and its error goes back as feedback. A second ` +
  `child passes, gets a full fit on the generation and validation mice at the session level, scores ` +
  `${CHILD_SCORE.toFixed(2)} and joins the template island, which re-ranks. A card migrates from the literature #1 ` +
  `island to the Eckstein-or-#4 island, and ` +
  `a "what worked so far" note joins the prompt every tenth generation. A best-score curve rises with proposals ` +
  `and a dollar counter grows (toy numbers).`,
  `${N_TRAIN} training-pool mice as dots: about 48 move into the generation group (feedback to Claude), ` +
  `about 48 into the validation group (the score) and about 100 into the selection group (picks the four final ` +
  `programs); the rest are not used in round 1. The ${N_TEST} test mice sit in a locked box, scored once at the ` +
  `end. Five gates light in order: 0 data parity (${N_TEST} mice, ` +
  `${REFS ? fmtN(REFS.n_test_sessions) : "—"} sessions, ${REFS ? fmtN(REFS.n_test_trials) : "—"} trials); ` +
  `1 parity in three parts, 1a dynamics, 1b fitter and 1c session level (1a and 1b: every model in the seed ` +
  `library matches its committed fit; 1c: CTT and Hattori, the only models with a hierarchical reference, match ` +
  `study 13's fits at the session level); 2 timing (a full evaluation in about 3 minutes; cohort sizes are fixed here); 3 engine smoke ` +
  `(about $7); 4 recovery of a known program from simulated mice (at most $20). Then the search: 5 islands, ` +

document.getElementById("transcript").innerHTML =
  SCENES.map((s, i) => `<h2>${s.name}</h2><p>${TEXT[i]}</p>`).join("");

// ---------- player ----------
// Play runs through all six scenes. prefers-reduced-motion shows each scene's last frame instead.
// A URL hash such as #s=3&t=12 freezes scene 3 at 12 s (used for render checks).
const REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const HASH = Object.fromEntries(location.hash.slice(1).split("&").filter(Boolean).map(kv => kv.split("=")));
const FROZEN = HASH.s !== undefined;
let cur = 0, t0 = performance.now(), playing = !REDUCED && !FROZEN, tPaused = 0;
const bar = document.getElementById("scenes"), playBtn = document.getElementById("play");
SCENES.forEach((s, i) => { const b = document.createElement("button"); b.textContent = s.name;
  b.onclick = () => go(i, true); bar.appendChild(b); });
function go(i, user) {
  cur = (i + SCENES.length) % SCENES.length; t0 = performance.now(); tPaused = REDUCED ? SCENES[cur].dur : 0;
  if (user || !REDUCED) playing = !REDUCED;
  playBtn.textContent = playing ? "❚❚ Pause" : "▶ Play";
  [...bar.children].forEach((b, k) => b.classList.toggle("on", k === cur));
  document.getElementById("cap").innerHTML = SCENES[cur].cap();
  C.setAttribute("aria-label", `Scene ${SCENES[cur].name}. A full description is in the text version below the caption.`);
}
document.getElementById("next").onclick = () => go(cur + 1, true);
document.getElementById("prev").onclick = () => go(cur - 1, true);
document.getElementById("replay").onclick = () => { go(cur, true); if (REDUCED) tPaused = SCENES[cur].dur; };
playBtn.onclick = () => {
  if (playing) { tPaused = (performance.now() - t0) / 1000; playing = false; playBtn.textContent = "▶ Play"; }
  else { if (tPaused >= SCENES[cur].dur) tPaused = 0;
    t0 = performance.now() - tPaused * 1000; playing = true; playBtn.textContent = "❚❚ Pause"; } };
const TOTAL = SCENES.reduce((s, x) => s + x.dur, 0);
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function frame(now) {
  let t = playing ? (now - t0) / 1000 : tPaused;
  if (playing && t > SCENES[cur].dur + 1.5 && cur < SCENES.length - 1) { go(cur + 1); t = 0; }
  else if (playing && t >= SCENES[cur].dur && cur === SCENES.length - 1) {    // the end: one click replays
    playing = false; tPaused = t = SCENES[cur].dur; playBtn.textContent = "▶ Play"; }
  const tt = Math.min(t, SCENES[cur].dur);
  SCENES[cur].draw(tt);
  X.fillStyle = COL.blue; X.fillRect(0, H - 3, W * tt / SCENES[cur].dur, 3);
  const before = SCENES.slice(0, cur).reduce((s, x) => s + x.dur, 0);
  document.getElementById("clock").textContent = `${mmss(before + tt)} / ${mmss(TOTAL)}`;
  requestAnimationFrame(frame);
}
document.getElementById("foot").innerHTML =
  "Scenes 1, 2 and 4–6 use toy data, and the toy model in scene 3 has one dial θ with p(right) = σ(θ). " +
  "Real programs have at most 8 parameters and 6 latent variables. Numbers in scene 3 (and the reference lines in " +
  "scene 6) are read from committed results by <code>build_explainer.py</code>: " +
  (REFS ? REFS.sources.map(s => `<code>${s.file}</code>${s.produced_at_pt ? ` (${s.produced_at_pt.slice(0, 10)})` : ""}`).join(", ")
        : "not filled yet") +
  ". GRU = GRU v2, H128, trained on all " + N_TRAIN + " pool mice; MLE CTT = per-mouse CompareToThreshold; HB-CTT = study 13's " +
  "two-level CompareToThreshold. These are the published values, each pooled over its own " + N_TEST + " test mice; " +
  "the headline re-pools every model on the test mice shared with the GRU's list. " +
  "Companion: <code>study40_schematic.html</code>.";
go(FROZEN ? Number(HASH.s) - 1 : 0);
if (FROZEN) { playing = false; tPaused = Number(HASH.t ?? 0); }
requestAnimationFrame(frame);
</script>
