# W&B sweep for 10-disrnn-near-gru-ceiling / stage3-wide-latent — step 3 (final) of the
# 3-stage near-GRU ablation. Fixed D=614 (subject_ratio=1.0), 2 seeds.
#
# QUESTION (study README). How much of the residual GRU gap (study 06: -0.0114 -> -0.0047
# at the tuned operating point, mult=1/beta=3e-4/latent_size=5/D=614) closes as disRNN's
# penalties, update-net nonlinearity, and latent width are relaxed toward a GRU-like model,
# attributed to each change individually via a STAGED ablation.
#
# THIS VARIANT = stage2-linear-update-net's config (penalty zeroed + linear update net)
# PLUS widening the latent from 5 to 256 — chosen to match study 01's H=256 GRU
# reference point exactly (GRU_CEIL at D=614 ~= 0.7267-0.7268), so this is the closest
# a disRNN-shaped model can get to that architecture's capacity. This is the ceiling
# probe: if the residual gap does not close even here, it is not explained by
# capacity/regularization at all.
#
# COMPILE-TIME / MEMORY RISK (untested territory — no prior study used latent_size != 5).
# HkDisentangledRNN.update_latents (disentangled_rnns/library/disrnn.py) builds ONE
# separate ResMLP per latent in a Python-level `for net_i in range(latent_size)` loop —
# unrolled at trace time, not vmapped. At latent_size=256 this is a ~51x increase in the
# number of update-net modules traced into one XLA graph vs. latent_size=5, which may
# mean much longer JIT compile time (not necessarily more GPU memory, since each
# per-latent MLP is still tiny: obs_size+256 -> 16 -> 2, n_layers=0). Monitor the first
# scheduled task's wall-clock-to-first-step before trusting the fan-out; this is exactly
# the "validate first" case the beaker-launch skill calls out for untested sizing.
#
# CAVEAT (study README, restated in every variant's notes.md): this is NOT an
# interpretable disRNN (compounding stage1 + stage2 + this), and its results must NOT be
# folded into study 06's operating-point verdict — that is why this is study 10, not a
# study-06 wave.
#
# TRAINING BUDGET: n_steps=100000, matching study 06's GRU-parity budget (study 01's H256
# GRU). checkpoint_run_heldout_eval=true (unlike study 06's mult-d-grid, which left it
# false) — a step-budget curve is a first-class deliverable here, not an afterthought.
entity: AIND-disRNN
project: disrnn_near_gru_ceiling
name: disrnn-stage3-wide-latent       # informational; launcher sets the real group
method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize
command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=disrnn
  - wandb.project=disrnn_near_gru_ceiling
  - "wandb.tags=[study10,stage3-wide-latent]"
  # --- cohort: D=614 fixed (subject_ratio=1.0 below), 2-way output ---
  - data.ignore_policy=exclude
  - data.subject_ratio=1.0
  # --- architecture: stage2's config + THE ABLATION (latent_size 5 -> 256, matches GRU H256) ---
  - model.architecture.choice_net_n_layers=0
  - model.architecture.latent_size=256
  - model.architecture.update_net_n_units_per_layer=16
  - model.architecture.update_net_n_layers=0
  # --- scalar session conditioning, identical to study 06's tuned point ---
  - model.architecture.session_encoding_type=scalar
  - model.architecture.session_n_pretrain_steps=30000
  - model.architecture.session_n_warmup_steps=20000
  # --- penalties: carried over from stage1 (interaction penalty already zeroed there) ---
  - model.penalties.beta=3e-4
  - model.penalties.update_net_latent_penalty_multiplier=0.0
  # --- lr pinned to the non-divergent value (study 03: mult=10 NaNs were at lr=5e-3) ---
  - model.training.lr=1e-3
  # --- training budget: GRU-parity (see header) ---
  - model.training.n_steps=100000
  - model.training.n_warmup_steps=7500
  - model.training.checkpoint_every_n_steps=10000
  # --- step-budget curve is a first-class deliverable this time (wave-2 lesson) ---
  - model.training.checkpoint_run_heldout_eval=true
  # --- length-bucketed batching, identical to study 03/05/06 ---
  - model.training.length_bucketing=true
  - model.training.length_bucket_grid=128
  - ${args_no_hyphens}
parameters:
  seed:
    values: [0, 1]
