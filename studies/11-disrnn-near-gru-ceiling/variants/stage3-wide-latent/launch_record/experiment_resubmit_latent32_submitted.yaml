# Reconstructed submitted spec for the latent-32 relaunch that actually produced this
# variant's reported results (Beaker experiment 01M23ZX664WP1QJQJNVBYY1V13, both tasks
# exit_code=0, WANDB_RUN_ID stage3-wide-latent-20260909-140640-{6ebc7ff0,c1ac9510} ==
# the two seeds in analysis/grid.csv). beaker_resubmit_latent32.json lists this id among
# four job_refs without distinguishing it from the two sizing/smoke probes that preceded
# it -- this file is linked from there as the result-producing submission specifically.
#
# PROVENANCE NOTE (Copilot review, PR #163): this relaunch was submitted as an ad hoc
# intervention (write_intervention), not via launch_beaker_resumable.py's normal
# submit()/save_record() path, so no experiment_resumable_submitted.yaml was written for
# it at launch time -- only the original failed latent-256 launch's spec is committed.
# Per the finding ("the launcher normally preserves that spec"), this file reconstructs
# that spec post hoc, pulled directly from Beaker's own job-execution record via the
# beaker-py API (b.experiment.get(eid).jobs[i].execution.spec) rather than from a local
# launcher output -- i.e. from the ACTUAL submitted task spec Beaker ran, not a template.
# One field could not be round-tripped through that API: `context.preemptible` reads back
# as unset (None) on the execution record, though the job's raw context carried an
# `auto_resume: true` field beaker-py 1.38 doesn't model (surfaced as an UNKNOWN-FIELD
# warning) -- autoResume is only auto-applied to preemptible tasks per this repo's own
# launcher convention, so `preemptible: true` below is inferred from that, not read
# directly off the API. Every other field (image, command, resources, constraints, the
# WRAPPER_REF/DISPATCHER_REF/FORAGING_MODELS_REF pinned SHAs, and the BFM_META_* /
# WANDB_RUN_ID/WANDB_RUN_GROUP provenance env vars) is read verbatim off the execution
# record; Beaker's own runtime-injected env vars (BEAKER_JOB_ID, BEAKER_WORKLOAD_ID, etc.)
# are stripped since they were not part of the original submission.
version: v2
description: stage3-wide-latent@20260909-140640 — 2 resumable grid tasks (autoResume)
tasks:
- name: stage3-wide-latent-20260909-140640-000
  image:
    beaker: han-hou/dynamic-foraging-bfm-wrapper-main-20260902
  command:
  - bash
  - /workspace/aind-dynamic-foraging-bfm-wrapper/beaker/entrypoint.sh
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=disrnn
  - wandb.project=disrnn_near_gru_ceiling
  - wandb.tags=[study10,stage3-wide-latent]
  - data.ignore_policy=exclude
  - data.subject_ratio=1.0
  - model.architecture.choice_net_n_layers=0
  - model.architecture.latent_size=32
  - model.architecture.update_net_n_units_per_layer=16
  - model.architecture.update_net_n_layers=0
  - model.architecture.session_encoding_type=scalar
  - model.architecture.session_n_pretrain_steps=30000
  - model.architecture.session_n_warmup_steps=20000
  - model.penalties.beta=3e-4
  - model.penalties.update_net_latent_penalty_multiplier=0.0
  - model.training.lr=1e-3
  - model.training.n_steps=100000
  - model.training.n_warmup_steps=7500
  - model.training.checkpoint_every_n_steps=10000
  - model.training.checkpoint_run_heldout_eval=true
  - model.training.length_bucketing=true
  - model.training.length_bucket_grid=128
  - seed=0
  constraints:
    cluster:
    - ai1/octo-hub-onprem-h200
  resources:
    gpuCount: 1
    cpuCount: 24
    memory: 180GiB
  envVars:
  - name: WANDB_API_KEY
    secret: han-wandb-api-key
  - name: WRAPPER_REF
    value: 9595dd371ab87de49c281d8ca4bb6ae8af7c32e4
  - name: DISPATCHER_REF
    value: 4b926dc53ee7b4be8c0b55a8f195b7fbde5fd5f3
  - name: FORAGING_MODELS_REF
    value: faa0f5ad063e375765aa9c31c7d3fee5eca78ecf
  - name: BFM_RESUMABLE_OUTPUT_DIR
    value: /results/run
  - name: WANDB_RUN_ID
    value: stage3-wide-latent-20260909-140640-6ebc7ff0
  - name: WANDB_RESUME
    value: allow
  - name: WANDB_RUN_GROUP
    value: stage3-wide-latent@20260909-140640
  - name: BFM_META_STUDY
    value: 10-disrnn-near-gru-ceiling
  - name: BFM_META_VARIANT
    value: stage3-wide-latent
  - name: BFM_META_LAUNCH_ID
    value: 20260909-140640
  - name: BFM_META_CONFIG_HASH
    value: 5d85ce31
  - name: BFM_META_LABEL
    value: stage3-wide-latent-relaunch-latent32
  - name: BFM_META_NOTE
    value: Relaunch after OOM/PJRT-arg-packing failure of the original latent_size=256
      target; downgraded to latent_size=32 per steering, validated by a sizing probe
      (01M23VHJSCFKF6Y80WDZGSJCZ0).
  result:
    path: /results
  context:
    priority: low
    preemptible: true
