# Variant nxd-h512 — extends the N×D joint-scaling grid with a new capacity row.
#
# Question: does the D-saturation / weak N×D interaction seen up to H=256 (r7)
# persist at a larger hidden size? Adds hidden_size=512 across the same four D
# columns used by the rectangular r7 grid, so the new row slots in directly.
#
# Unlike the H=128 row (reused from v2-sc-active), there is NO existing H=512
# column anywhere — every cell here is new. Grid:
#   hidden_size ∈ {512} × subject_ratio ∈ {0.016, 0.049, 0.163, 1.0}
#     (D ≈ 10 / 30 / 100 / 614) × seed ∈ {0, 1, 2} = 12 tasks.
#
# ALL other knobs identical to nxd-grid / v2-sc-active (scalar SC, λ forward:
# full session conditioning @50k, n_steps=150k, lr=1e-5, gated early-stop @70k,
# length bucketing, per-checkpoint held-out eval OFF). Distinct W&B group
# (launcher sets nxd-h512@<launch_id>) so it sits beside the other rows in the
# same project for the joint N×D view.

entity: AIND-disRNN
project: mice_data_scaling
name: mice-data-scaling-nxd-h512          # informational; launcher sets the real group

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=gru_scaling
  - wandb.project=mice_data_scaling
  - model.architecture.session_encoding_type=scalar
  # lambda forward: pretrain 30k, warmup 30k->50k => full session conditioning at 50k.
  - model.architecture.session_n_pretrain_steps=30000
  - model.architecture.session_n_warmup_steps=20000
  - model.training.n_steps=150000
  - model.training.lr=1e-5
  - model.training.checkpoint_run_heldout_eval=false
  - model.training.length_bucketing=true
  # gated early stop: only arms at >=70k (20k after full lambda); catches post-SC overfit.
  - model.training.early_stopping.enabled=true
  - model.training.early_stopping.start_after_step=70000
  - ${args_no_hyphens}

parameters:
  model.architecture.hidden_size:
    values: [512]
  data.subject_ratio:
    values: [0.016, 0.049, 0.163, 1.0]
  seed:
    values: [0, 1, 2]
