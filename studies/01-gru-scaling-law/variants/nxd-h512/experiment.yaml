# Task template for variant nxd-h512 D=614 cells (consumed by launch_beaker_resumable.py).
#
# WHY BEAKER: the 3 D=614 (subject_ratio=1.0) cells at hidden_size=512 could not be
# landed on Allen HPC SLURM -- host RAM climbed unboundedly through the training loop
# and OOM-killed at 128G, 256G and (in CPU profiling probes) even 400G. Three
# hypotheses were tested and falsified (length-bucketing compile cache, Python-side
# object leak via tracemalloc, JAX async-dispatch backpressure via per-step
# block_until_ready). The H=256/D=614 cells that feed r7 succeeded on THIS backend,
# so run the H=512 D=614 cells on the known-good path instead of continuing to debug
# the SLURM route.
#
# IMAGE: han-hou/disrnn-wrapper-main-20260712. The older han-hou/disrnn-wrapper-pck-integration
# named in the June nxd-grid launch record still RESOLVES via the Beaker API but its backing
# container blob has been garbage-collected -- a first launch attempt with it failed at
# container creation on all 3 tasks ("No such image: gcr.io/ai2-beaker-core/public/
# d8q83ql1t06s73f0bq50:latest"). Verify the image against a RECENT exit-0 job, not an old
# launch record. The image only supplies the environment; the entrypoint checks out
# WRAPPER_REF at container start, so the pinned wrapper SHA is what actually runs.
#
# CLUSTER: onprem-h200 only. The workspace's ai1/octo.ai-aws-p5en access is currently
# revoked, so listing it adds an inert target whose tasks silently never schedule.
#
# MEMORY SIZING: onprem-h200 node bundle = 8 GPU / 3024 GiB / 224 CPU, i.e. ~378 GiB
# and 28 CPU per GPU. Requesting more than ONE bundle silently grabs extra GPUs, so
# memory/cpuCount stay inside one bundle: 360GiB / 24 CPU (1.4x the 256GiB that
# sufficed at H=256). Verify BEAKER_ASSIGNED_GPU_COUNT == 1 on the first scheduled job.
version: v2
description: nxd-h512 D=614 cells on Beaker h200 (HPC SLURM route exhausted)
tasks:
  - name: data-scaling-nxd-h512-d614
    image:
      beaker: han-hou/disrnn-wrapper-main-20260712
    command:
      - bash
      - /workspace/aind-disrnn-wrapper/beaker/entrypoint.sh
      - wandb
      - agent
    constraints:
      cluster:
        - ai1/octo-hub-onprem-h200
    resources:
      gpuCount: 1
      cpuCount: 24
      memory: 360GiB
    context:
      priority: low
      preemptible: true
    envVars:
      - name: WANDB_API_KEY
        secret: han-wandb-api-key
      - name: WRAPPER_REF
        value: eb5a6bb02c828bfabceeccf30aac4958477b4098   # wrapper origin/main (pushed)
      - name: DISPATCHER_REF
        value: 460306610515dee12414444caf50ea881755ecc3   # appending-study-01-nxd-h512 (pushed)
      - name: FORAGING_MODELS_REF
        value: main   # readable; launcher resolves to an immutable SHA before submit
    result:
      path: /results
