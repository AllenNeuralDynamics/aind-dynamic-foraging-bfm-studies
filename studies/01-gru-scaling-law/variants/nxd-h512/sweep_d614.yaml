# Variant nxd-h512 — D=614 RESUBMIT (host-RAM OOM recovery).
#
# The first h200 launch (array 23263174) trained 9/12 cells cleanly but the 3
# D=614 seeds (subject_ratio=1.0, full 614-mouse dataset) were host-RAM
# OOM-killed at --mem=128G during data loading (MaxRSS ~81–95G, true peak >128G;
# slurmstepd oom_kill). NOT a GPU OOM — h200 was fine. This resubmits ONLY those
# 3 cells with --mem=256G (launcher --sbatch-extra), same h200 tier, batch size
# unchanged. Distinct W&B group (launcher sets nxd-h512@<launch_id>) but the same
# project; nxd_scaling.py collects both h512 groups.
#
#   hidden_size ∈ {512} × subject_ratio ∈ {1.0} (D ≈ 614) × seed ∈ {0,1,2} = 3 tasks.
# ALL other knobs identical to the 12-cell sweep.yaml.

entity: AIND-disRNN
project: mice_data_scaling
name: mice-data-scaling-nxd-h512-d614      # informational; launcher sets the real group

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=gru_scaling
  - wandb.project=mice_data_scaling
  - model.architecture.session_encoding_type=scalar
  - model.architecture.session_n_pretrain_steps=30000
  - model.architecture.session_n_warmup_steps=20000
  - model.training.n_steps=150000
  - model.training.lr=1e-5
  - model.training.checkpoint_run_heldout_eval=false
  - model.training.length_bucketing=true
  - model.training.early_stopping.enabled=true
  - model.training.early_stopping.start_after_step=70000
  - ${args_no_hyphens}

parameters:
  model.architecture.hidden_size:
    values: [512]
  data.subject_ratio:
    values: [1.0]
  seed:
    values: [0, 1, 2]
