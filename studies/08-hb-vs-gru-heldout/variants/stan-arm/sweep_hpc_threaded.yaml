# HB Stan arm, threaded — the relaunch of sweep_hpc.yaml with reduce_sum actually using cores.
#
#     python code/launch_hpc.py \
#       --sweep-yaml studies/08-hb-vs-gru-heldout/variants/stan-arm/sweep_hpc_threaded.yaml \
#       --mode cpu --agent-count 1 \
#       --sbatch-extra='--array=0-1 --cpus-per-task=32 --mem=128G --time=72:00:00'
#
# WHY A SECOND SWEEP RATHER THAN AN EDIT: launch 20260905-020928 ran single-threaded because
# STAN_NUM_THREADS was unset. Its D≈29 rung is still running and will produce a usable
# posterior, so keeping that grid intact leaves it identifiable in W&B.
#
# BOTH RUNGS, and D≈29 is here on purpose even though it already has a completed fit.
# That fit (launch 20260905-020928, 53001 s) ran the pre-reslice model, whose reduce_sum
# copied its parameter arrays into every partial sum. Its POSTERIOR is valid — same target
# density — so its ESS and r_hat stand, but its wall time is a floor rather than Stan's
# speed, and the ESS/second comparison against NumPyro is built on it. Re-running D≈29 here
# converts that floor into a measurement and prices the reslice on identical data and seed.
#
# --exclusive is not optional: Stan's TBB threads busy-wait, so a threaded job sharing a node
# inflates load far past its core count and slows every neighbour including itself. The first
# threaded attempt put both tasks on one node alongside a third job — 8 chain processes, 32
# threads each, load 149 on an 88-core box. With --exclusive each array task gets its own
# node, which is what makes running both rungs at once safe.
#
# CPUs: 64 = 4 chains x 16 reduce_sum threads, on an exclusive 88-core node. HBStanTrainer derives the split from
# SLURM_CPUS_PER_TASK // num_chains, so changing --cpus-per-task changes the threading and
# nothing else needs editing.
#
# Rates this replaces, for reference. Single-threaded: D≈29 ~1300 iter/h (completed in 14.7 h),
# D≈99 ~53 iter/h. Threaded but pre-reslice: D≈99 managed under 160 iterations in 3 h on 92
# busy cores — no better than one thread, because reduce_sum was copying ~3.7M autodiff
# variables per gradient rather than computing. That is the fix this sweep tests.

entity: AIND-disRNN
project: mice_data_scaling

method: grid
metric:
  name: hb/min_ess_per_second
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=hb_hattori_stan
  - seed=0
  - "wandb.tags=[hb,stan,issue-129,threaded]"
  - ${args_no_hyphens}

parameters:
  data.subject_ratio:
    values: [0.049, 0.163]     # D≈29 (reslice rerun) and D≈99
