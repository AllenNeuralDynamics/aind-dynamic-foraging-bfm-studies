# HB one-stage ladder on Beaker — production rungs.
#
# One grid point per rung of study 01's D dial. D≈30 (0.049) is the baseline rung;
# add 0.163 (D≈101) here once D≈30 has landed.
#
# Fixed values live in the configs, not in this file:
#   data   -> code/config/data/mice_snapshot_scaling.yaml   (study 01's own file)
#   model  -> code/config/model/hb_hattori.yaml
# This sweep only selects them and declares the grid axis.
#
# `wandb.project` MUST appear in `command:` below and not only in the top-level
# `project:` key. The resumable launcher sets the W&B *group* only; the project comes
# from Hydra, whose default is `test`. The top-level `project:` is read exclusively by
# the native wandb controller, which this route does not use.
#
# Project is study 01's `mice_data_scaling`, deliberately — see notes.md "Deviations".

entity: AIND-disRNN
project: mice_data_scaling
name: hb-one-stage-beaker

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=hb_hattori
  - seed=0
  - wandb.entity=AIND-disRNN
  - wandb.project=mice_data_scaling
  - ${args_no_hyphens}

parameters:
  data.subject_ratio:
    values: [0.049]        # D≈30 against the ~614 pool, seed 0 — matches study 01
