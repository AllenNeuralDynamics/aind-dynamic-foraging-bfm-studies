# Beaker counterpart of smoke.sbatch: smallest real cohort, minimal sampler.
#
# Proves the production path end to end on Beaker — image pull, entrypoint refresh of
# all three repos, S3 snapshot read, Hydra composition across both repos, the HB branch
# in training_runner, the fit, held-out scoring, and the W&B write. It proves nothing
# scientific: 30 warmup / 30 samples / 1 chain is not a posterior.
#
# Logs to project `test`, NOT `mice_data_scaling` — a smoke must never land on study
# 01's scaling curve, which analyze_scaling.py reads.
#
# Launch:
#   python code/launch_beaker_resumable.py \
#     --sweep      studies/08-hb-vs-gru-heldout/variants/one-stage-ladder/sweep_beaker_smoke.yaml \
#     --experiment studies/08-hb-vs-gru-heldout/variants/one-stage-ladder/experiment_beaker.yaml \
#     --workspace  ai1/aind-dynamic-foraging-foundation-model \
#     --label smoke --note "path smoke through run_hpc on Beaker"

entity: AIND-disRNN
project: test
name: hb-one-stage-beaker-smoke

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=hb_hattori
  - data.subject_ratio=0.016
  - model.num_warmup=30
  - model.num_samples=30
  - model.num_chains=1
  - model.few_shot_k=[0]
  - wandb.entity=AIND-disRNN
  - wandb.project=test
  - ${args_no_hyphens}

# The launcher requires a grid axis, and every value above is already fixed, so pin the
# seed as a one-point axis rather than inventing a second condition.
parameters:
  seed:
    values: [0]
