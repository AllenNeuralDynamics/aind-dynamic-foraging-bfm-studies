## Beaker task template for the HB one-stage ladder.
##
## Only the image / cluster / resources / refs / secret are read from here — the
## resumable launcher keeps `command[:2]` (bash + entrypoint.sh) and appends the
## sweep's own `command:`, so the tail below is a placeholder, not the real command.
##
## Launch through the launcher, never by hand: it expands the grid, sets the W&B
## group, injects BFM_META_* provenance, and pins all three REFs to full SHAs.
##   python code/launch_beaker_resumable.py \
##     --sweep      studies/08-hb-vs-gru-heldout/variants/one-stage-ladder/sweep_beaker.yaml \
##     --experiment studies/08-hb-vs-gru-heldout/variants/one-stage-ladder/experiment_beaker.yaml \
##     --workspace  ai1/aind-dynamic-foraging-foundation-model \
##     --label d30 --note "..."

version: v2
description: HB-Hattori2019 one-stage cohort fit (template; the launcher rewrites this)
tasks:
  - name: hb-one-stage
    # The only image carrying the models [bayes] extra (numpyro / arviz), so HB needs
    # it. It also clones to /workspace/aind-dynamic-foraging-bfm-* — the image and the
    # paths in the command are a matched pair; mixing generations dies at container
    # startup with no logs. See ../../../../code/beaker/README.md.
    image:
      beaker: han-hou/dynamic-foraging-bfm-wrapper-main-20260902
    command:
      - bash
      - /workspace/aind-dynamic-foraging-bfm-wrapper/beaker/entrypoint.sh
      # placeholder tail — replaced by the sweep's command
      - "true"
    # NOT the launcher's low/preemptible burst default. HB has no checkpointing:
    # model/hb_hattori.yaml has no `training` block, so there is no
    # checkpoint_every_n_steps and nothing for autoResume to resume from — a preempted
    # task restarts the NUTS fit at zero. A guaranteed slot is cheaper than a restart
    # loop on a multi-hour fit. The launcher honours an explicit context block.
    context:
      priority: normal
      preemptible: false
    constraints:
      cluster:
        # onprem-H200: reaches AWS S3 (required — mice_snapshot_scaling reads the
        # parquet cache in us-west-2), 141GB GPU, and usually the emptiest hub pool.
        # GCP clusters are ruled out for any mice-data run regardless of free GPUs.
        - ai1/octo-hub-onprem-h200
    resources:
      gpuCount: 1
      # Well inside one GPU's host bundle on these ~3.25TiB nodes, so gpuCount stays 1.
      # Over-asking for memory silently grabs extra GPUs.
      memory: 128GiB
    envVars:
      - name: WANDB_API_KEY
        secret: han-wandb-api-key
      - name: BFM_OUTPUT_DIR
        value: /results
      # Readable branch values; the launcher submits the resolved full SHAs.
      - name: WRAPPER_REF
        value: main
      - name: DISPATCHER_REF
        value: main
      - name: FORAGING_MODELS_REF
        value: main
    result:
      path: /results
