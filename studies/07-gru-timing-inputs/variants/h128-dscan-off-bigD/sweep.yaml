# RT+lick inputs — H128 D-scan, TIMING-**OFF** (paired baseline arm).
#
# WHY THIS EXISTS: the d100-bridge variant FAILED its bridge. A timing-OFF arm on
# this wrapper SHA/image gives held-out 0.72790 +/- 0.00016 vs study-01
# v2-sc-active's 0.72729 +/- 0.00013 -- a +0.00061 offset, ~4 SD apart. Diagnosed
# (see d100-bridge/notes.md) as COHORT COMPOSITION, not code drift: study-01 ran
# with data.snapshot=None (the rolling root table) while this study pins
# 20260603, and rank-based selection over densely-tied session counts swaps 1-3
# mice per seed and shifts the held-out population. So study-01's H128 column is
# NOT a valid baseline here and every D needs its own paired OFF arm.
#
# PARITY: knobs are byte-identical to variant h128-dscan (the ON arm) except
# data.timing_features.enabled=false. WRAPPER_REF is pinned to the SAME SHA the
# ON arm ran (911321c0), NOT the later held-out fix -- that fix is a no-op when
# timing is disabled (returns the frame untouched), so pinning the ON arm's SHA
# makes this a true one-variable contrast.
#
# SCORING: each (D, seed) cell here shares subject_sample_seed with its ON
# counterpart, so the pair resolves to an IDENTICAL cohort (verified on the
# bridge: 99/101/101 mice, identical at every seed). After training, BOTH arms
# will be re-scored with the same script and checkpoint policy so the curve is
# not built from mixed scoring paths -- the ON arm's numbers currently come from
# a step_70000 best_eval re-score while OFF scores natively at its stop point.
#
# PRIMARY METRIC: heldout/final/eval_likelihood. Within-subject LL is a
# diagnostic only (train-eval gap).

entity: AIND-disRNN
project: mice_rt_lick_scaling
name: h128-dscan-off-bigD

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=gru_scaling
  - wandb.project=mice_rt_lick_scaling
  - model.architecture.hidden_size=128
  - model.architecture.session_encoding_type=scalar
  # lambda forward: pretrain 30k, warmup 30k->50k => full session conditioning at 50k.
  - model.architecture.session_n_pretrain_steps=30000
  - model.architecture.session_n_warmup_steps=20000
  - model.training.n_steps=150000
  - model.training.lr=1e-5
  - model.training.checkpoint_run_heldout_eval=false
  - model.training.length_bucketing=true
  # gated early stop: only arms at >=70k (20k after full lambda); catches post-SC overfit.
  - model.training.early_stopping.enabled=true
  - model.training.early_stopping.start_after_step=70000
  # single D cell for phase 0 (D~100: the cell with a tight study-01 bridge target)

  - data.timing_features.enabled=false
  - ${args_no_hyphens}

parameters:
  data.subject_ratio:
    values: [0.489, 1.0]
  seed:
    values: [0, 1, 2]
