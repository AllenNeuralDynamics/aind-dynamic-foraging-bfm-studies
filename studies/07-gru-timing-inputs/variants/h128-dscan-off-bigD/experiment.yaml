# TIER 1 / ALLOCATED (guaranteed, never evicted): {priority: high, preemptible: false}.
# The workspace has 8 allocated slots; this launch uses 6 (D=0.489,1.0 x 3 seeds).
# Big-D cells are the longest (~10h) and the most expensive to lose to an eviction
# restart, so they get the protected slots. Small-D cells run preemptible instead.
#
# CLUSTER: BOTH S3-capable H200 clusters are listed so the scheduler places freely.
# This is deliberate and fixes a design error in the ON arm, where the D grid was
# SPLIT by D across clusters -- making D and hardware correlated, so a cluster
# artifact would alias onto the curve's shape. Listing both leaves placement
# orthogonal to D. Actual placement is recorded in launch_record after the fact.
# (GCP clusters are excluded: they cannot reach the AWS S3 parquet cache.)
version: v2
description: study-07 timing-OFF paired baseline, big D (allocated tier)
tasks:
  - name: dscan-off-bigD
    image:
      beaker: han-hou/disrnn-wrapper-main-20260712
    command:
      - bash
      - /workspace/aind-disrnn-wrapper/beaker/entrypoint.sh
      - wandb
      - agent
    context:
      priority: high
      preemptible: false
    constraints:
      cluster:
        - ai1/octo-hub-onprem-h200
        - ai1/octo-hub-aws-h200
    resources:
      gpuCount: 1
      cpuCount: 16
      memory: 256GiB
    envVars:
      - name: WANDB_API_KEY
        secret: han-wandb-api-key
      - name: WRAPPER_REF
        value: 911321c0b7e54fd4ff11c1d22306b8684eb1f2ef
      - name: DISPATCHER_REF
        value: 285e3be2ce2b641eafd852561c6a3320306000cf
      - name: FORAGING_MODELS_REF
        value: main
    result:
      path: /results
