# RT+lick inputs — Phase 0: ONE D cell, paired timing OFF/ON.
#
# Every knob below is copied VERBATIM from study-01 variant v2-sc-active
# (studies/01-gru-scaling-law/variants/v2-sc-active/sweep.yaml), which produced
# study-01's H128 column. The ONLY additions are:
#   - data.timing_features.enabled  {false, true}   <- the science knob
#   - data.subject_ratio pinned to 0.163 (D~100)    <- single cell for phase 0
#
# The timing_features=false arm is the BRIDGE CONTROL: study-01's runs used
# WRAPPER_REF=65c3350d, while we run a newer SHA (float-safe dataset builder +
# update-rule plotting guard). Reproducing 0.72729 +/- 0.00013 held-out on the
# OFF arm is what licenses reusing study-01's H128 column later instead of
# re-running the whole baseline.
#
# PRIMARY METRIC: heldout/final/eval_likelihood. Within-subject likelihood is a
# DIAGNOSTIC only (train-eval gap) -- at H128 a 0.0076 effect is 10 sd on
# held-out but 1.7 sd within-subject, and the two correlate only r=0.28.

entity: AIND-disRNN
project: mice_rt_lick_scaling
name: d100-bridge

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=gru_scaling
  - wandb.project=mice_rt_lick_scaling
  - model.architecture.hidden_size=128
  - model.architecture.session_encoding_type=scalar
  # lambda forward: pretrain 30k, warmup 30k->50k => full session conditioning at 50k.
  - model.architecture.session_n_pretrain_steps=30000
  - model.architecture.session_n_warmup_steps=20000
  - model.training.n_steps=150000
  - model.training.lr=1e-5
  - model.training.checkpoint_run_heldout_eval=false
  - model.training.length_bucketing=true
  # gated early stop: only arms at >=70k (20k after full lambda); catches post-SC overfit.
  - model.training.early_stopping.enabled=true
  - model.training.early_stopping.start_after_step=70000
  # single D cell for phase 0 (D~100: the cell with a tight study-01 bridge target)
  - data.subject_ratio=0.163
  - ${args_no_hyphens}

parameters:
  data.timing_features.enabled:
    values: [false, true]
  seed:
    values: [0, 1, 2]
