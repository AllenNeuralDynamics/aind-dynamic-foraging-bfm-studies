# Phase-0 task template (consumed by launch_beaker.py). Cluster/resources copied
# from study-01 v2-sc-active so the bridge comparison is on identical hardware.
version: v2
description: rt-lick phase0 — one D cell, timing OFF vs ON, H128
tasks:
  - name: rt-lick-phase0
    image:
      beaker: han-hou/disrnn-wrapper-main-20260712
    command:
      - bash
      - /workspace/aind-disrnn-wrapper/beaker/entrypoint.sh
      - wandb
      - agent
    constraints:
      cluster:
        # NOTE: study-01 v2-sc-active ran on octo-hub-onprem-h200, but that cluster's
        # nodes could not pull han-hou/disrnn-wrapper-main-20260712 ("No such image",
        # 6/6 tasks failed to start on 2026-08-22, exp 01M0KXMD7WR0DBBK7HN4GWDE6M and
        # 01M0KXVN5KKMCWKC89MNYHJTN2). aws-h200 is where this image is verified working
        # (smoke exp 01M0KSXGXNGC4BC5N5WVB50H10). Hardware differs from study-01, which
        # is exactly why the paired timing-OFF bridge arm exists: it re-measures the
        # baseline under THIS image + cluster + wrapper SHA rather than assuming
        # study-01's number transfers.
        - ai1/octo-hub-aws-h200
    resources:
      gpuCount: 1
      cpuCount: 16
      memory: 256GiB
    envVars:
      - name: WANDB_API_KEY
        secret: han-wandb-api-key
      - name: WRAPPER_REF
        value: 911321c0b7e54fd4ff11c1d22306b8684eb1f2ef
      - name: DISPATCHER_REF
        value: 285e3be2ce2b641eafd852561c6a3320306000cf
      - name: FORAGING_MODELS_REF
        value: main
    result:
      path: /results
