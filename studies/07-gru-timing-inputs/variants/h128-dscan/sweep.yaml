# RT+lick inputs — H128 D-scan, TIMING ARM ONLY.
#
# Knobs identical to variant d100-bridge (which in turn copies study-01
# v2-sc-active verbatim); the only differences are:
#   - data.timing_features.enabled pinned TRUE   (this variant is the timing arm)
#   - data.subject_ratio swept over the study-01 D grid
#
# WHY THIS RUNS BEFORE THE d100-bridge VERDICT: the timing arm is required at
# every D whichever way the bridge lands. The bridge only decides where the
# BASELINE comes from -- reuse study-01's H128 column (bridge holds) or run paired
# timing-OFF arms (bridge fails). So this launch is pure parallelization and
# nothing here is invalidated by either outcome. The OFF arms, if needed, are a
# separate launch once the bridge reports.
#
# subject_ratio 0.163 (D~100) is INCLUDED even though d100-bridge already has that
# timing cell: keeping every point of the headline curve inside one launch avoids
# an un-diagnosable kink from cross-launch pooling, and the duplicate doubles as a
# cross-launch seed-level reproducibility check at one cell.
#
# PRIMARY METRIC: heldout/final/eval_likelihood. Within-subject LL is a diagnostic
# only (train-eval gap) -- see the study README.

entity: AIND-disRNN
project: mice_rt_lick_scaling
name: h128-dscan

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=gru_scaling
  - wandb.project=mice_rt_lick_scaling
  - model.architecture.hidden_size=128
  - model.architecture.session_encoding_type=scalar
  # lambda forward: pretrain 30k, warmup 30k->50k => full session conditioning at 50k.
  - model.architecture.session_n_pretrain_steps=30000
  - model.architecture.session_n_warmup_steps=20000
  - model.training.n_steps=150000
  - model.training.lr=1e-5
  - model.training.checkpoint_run_heldout_eval=false
  - model.training.length_bucketing=true
  # gated early stop: only arms at >=70k (20k after full lambda); catches post-SC overfit.
  - model.training.early_stopping.enabled=true
  - model.training.early_stopping.start_after_step=70000
  # single D cell for phase 0 (D~100: the cell with a tight study-01 bridge target)

  - data.timing_features.enabled=true
  - ${args_no_hyphens}

parameters:
  data.subject_ratio:
    values: [0.016, 0.049, 0.163, 0.489, 1.0]
  seed:
    values: [0, 1, 2]
