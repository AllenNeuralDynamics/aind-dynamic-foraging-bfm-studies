# RT+lick inputs — H128 D-scan, TIMING ARM, ONPREM half.
#
# Companion to variant h128-dscan. Identical recipe; this launch covers the
# subject_ratio values whose tasks were still QUEUED on ai1/octo-hub-aws-h200
# (0.163, 0.489, 1.0 x 3 seeds = 9 tasks), moved to ai1/octo-hub-onprem-h200
# where 16 slots were idle.
#
# WHY SPLIT: aws-h200 filled to 0 free with 11 of my own tasks running and 10 of
# my own queued behind them, which serialized the grid for no reason. onprem was
# completely idle.
#
# ONPREM WAS VERIFIED BEFORE USE, because an earlier launch there failed:
#   - image pull: probe 01M0M94G2PF56JX7A1123A269M printed IMAGE_PULL_OK with
#     han-hou/disrnn-wrapper-main-20260712. The earlier failure on this cluster
#     was the OLD 2026-06-18 image, not the cluster.
#   - S3 parquet read: probe 01M0M95WX3PD1ADG9D1PG4QTDT read the snapshot session
#     table and printed 'S3_PARQUET_OK sessions= 23868'. This matters because GCP
#     clusters (gcp-h100, gcp-h200) CANNOT reach the AWS S3 parquet cache and are
#     therefore unusable for any DB-backed run; onprem is on-prem, not GCP, and
#     study-01's own H128 column trained here.
#
# The aws-h200 tasks for sr=0.016 and 0.049 keep running; their queued siblings
# for the three larger D values are cancelled in favour of this launch. Same
# W&B project, so the curve reassembles across both groups.

entity: AIND-disRNN
project: mice_rt_lick_scaling
name: h128-dscan-onprem

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=gru_scaling
  - wandb.project=mice_rt_lick_scaling
  - model.architecture.hidden_size=128
  - model.architecture.session_encoding_type=scalar
  # lambda forward: pretrain 30k, warmup 30k->50k => full session conditioning at 50k.
  - model.architecture.session_n_pretrain_steps=30000
  - model.architecture.session_n_warmup_steps=20000
  - model.training.n_steps=150000
  - model.training.lr=1e-5
  - model.training.checkpoint_run_heldout_eval=false
  - model.training.length_bucketing=true
  # gated early stop: only arms at >=70k (20k after full lambda); catches post-SC overfit.
  - model.training.early_stopping.enabled=true
  - model.training.early_stopping.start_after_step=70000
  # single D cell for phase 0 (D~100: the cell with a tight study-01 bridge target)

  - data.timing_features.enabled=true
  - ${args_no_hyphens}

parameters:
  data.subject_ratio:
    values: [0.163, 0.489, 1.0]
  seed:
    values: [0, 1, 2]
