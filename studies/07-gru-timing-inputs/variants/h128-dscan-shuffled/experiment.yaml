# TIER 3 / LOW priority + preemptible, DELIBERATELY.
#
# This is priority 3 of 4 in Han's ordering, behind the timing-OFF arms that are
# still training and hold 15 slots. Low priority fills idle capacity and is
# evicted FIRST, so queuing this arm now cannot slow the OFF arms down -- it takes
# only what they are not using. autoResume is auto-applied to preemptible tasks
# (never set it explicitly; Beaker rejects the combination), so an eviction
# restarts from the last checkpoint rather than losing the cell.
#
# The trade is wall-clock, not correctness: these 15 tasks may take longer than
# the OFF arms did, and may be evicted repeatedly. That is the right trade for a
# control arm whose result is only interpretable once the OFF arms have landed
# anyway.
#
# CLUSTER: both S3-capable H200 clusters, so placement stays ORTHOGONAL to the
# swept D axis. (The ON arm was split by D across clusters, correlating D with
# hardware; that is the error this avoids. GCP clusters cannot reach the AWS S3
# parquet cache and are excluded.)
#
# WRAPPER_REF is pinned to the SHA that carries BOTH the shuffle implementation
# and the run-seed derivation fix -- an earlier SHA would silently permute the
# held-out frame with seed 0 while training used the run seed.
version: v2
description: study-07 shuffled-response control arm, H128 D-scan (low/preemptible tier)
tasks:
  - name: dscan-shuffled
    image:
      beaker: han-hou/disrnn-wrapper-main-20260712
    command:
      - bash
      - /workspace/aind-disrnn-wrapper/beaker/entrypoint.sh
      - wandb
      - agent
    context:
      priority: low
      preemptible: true
    constraints:
      cluster:
        - ai1/octo-hub-onprem-h200
        - ai1/octo-hub-aws-h200
    resources:
      gpuCount: 1
      cpuCount: 16
      memory: 256GiB
    envVars:
      - name: WANDB_API_KEY
        secret: han-wandb-api-key
      - name: WRAPPER_REF
        value: 78b8d11857653d83b9e8bd4191e8f0fced0c2a3c
      - name: DISPATCHER_REF
        value: ae8707d189434006b7ae3d9b77887d51077e92e9
      - name: FORAGING_MODELS_REF
        value: main
    result:
      path: /results
