# RT+lick inputs — H128 D-scan, SHUFFLED-RESPONSE CONTROL ARM.
#
# Priority 3 of 4 in Han's ordering (all ON -> OFF no-new-inputs -> OFF shuffled
# -> ON single-block). Knobs are byte-identical to variant h128-dscan (the real
# timing arm); the ONLY difference is data.timing_features.shuffle=true.
#
# WHAT THIS ARM IS FOR. The real arm widens the observation vector 2 -> 5, which
# adds 9H parameters (+2.2% at H128) and changes the total regularization budget.
# So a win could in principle come from extra capacity rather than from the
# information in RT/licking. This arm permutes the raw response columns WITHIN
# each session before the previous-trial shift: same observation width, same
# per-channel means and sds (verified identical to 4 dp), same bottleneck budget,
# but trial alignment destroyed. Hence
#     real - shuffled   = value of TRIAL-ALIGNED information
#     shuffled - OFF    = value of session-level response statistics alone
#
# NOT a zero-information baseline. Session-level structure survives by design:
# measured on real held-out data, session-DEMEANED correlation with choice falls
# to ~0.003 (from -0.642 for n_lick_left), while the RAW correlation stays ~0.17
# for logRT. So real-minus-shuffled is a LOWER bound on the information effect.
#
# shuffle_seed is left UNSET, which the wrapper resolves to the run seed. So the
# three replicates per D cell each get a DIFFERENT permutation rather than three
# fits of one permutation -- otherwise the reported seed spread would measure
# optimizer noise only and understate permutation variance. 15 tasks, not 45.
#
# TIER: low priority + preemptible, deliberately. This arm is priority 3 and must
# NOT compete with the still-running OFF arms (priority 2, holding 15 slots).
# Low/preemptible fills idle capacity and is evicted first, with autoResume.
#
# PRIMARY METRIC: heldout/final/eval_likelihood. Within-subject LL is a
# diagnostic only (train-eval gap) -- see the study README.

entity: AIND-disRNN
project: mice_rt_lick_scaling
name: h128-dscan-shuffled

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=gru_scaling
  - wandb.project=mice_rt_lick_scaling
  - model.architecture.hidden_size=128
  - model.architecture.session_encoding_type=scalar
  # lambda forward: pretrain 30k, warmup 30k->50k => full session conditioning at 50k.
  - model.architecture.session_n_pretrain_steps=30000
  - model.architecture.session_n_warmup_steps=20000
  - model.training.n_steps=150000
  - model.training.lr=1e-5
  - model.training.checkpoint_run_heldout_eval=false
  - model.training.length_bucketing=true
  # gated early stop: only arms at >=70k (20k after full lambda); catches post-SC overfit.
  - model.training.early_stopping.enabled=true
  - model.training.early_stopping.start_after_step=70000
  # single D cell for phase 0 (D~100: the cell with a tight study-01 bridge target)

  - data.timing_features.enabled=true
  - data.timing_features.shuffle=true
  - ${args_no_hyphens}

parameters:
  data.subject_ratio:
    values: [0.016, 0.049, 0.163, 0.489, 1.0]
  seed:
    values: [0, 1, 2]
