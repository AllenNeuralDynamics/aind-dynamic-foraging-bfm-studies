# RT+lick inputs — H128 D-scan, REACTION-TIME-ONLY arm.
#
# Priority 4 of 4 in Han's ordering (all ON -> OFF no-new-inputs -> OFF shuffled
# -> ON single-block). Knobs are byte-identical to variant h128-dscan (the real
# combined arm); the ONLY difference is which feature block is switched on.
#
# WHY BOTH AT 3 SEEDS (Han's call). The logistic probe suggested the two blocks
# are very unequal (licks +0.0061, RT +0.0009 of the +0.0067 joint delta), so a
# power calculation argued for 6 seeds on the RT arm. Running 3 for now: the
# licks arm is well powered, and the RT arm is explicitly a FIRST LOOK. If RT-only
# lands within ~2 se of zero, that is NOT evidence of no effect -- add seeds
# before drawing any conclusion from it.
#
# WHAT THESE ARMS SETTLE. The combined arm carries +0.0075 of trial-aligned
# information, flat across cohort size (see study notes, three-way grid). These
# two arms ask which block carries it. The blocks are NOT symmetric:
#   - logRT is near-orthogonal to the existing inputs (R^2 ~ 0.00 on prev
#     choice+reward) but contributed little to the linear probe.
#   - lick counts are heavily redundant with prev choice (R^2 ~ 0.61-0.63) yet
#     carried most of the probe's delta.
# So a large licks-only effect would mean the value is in a NONLINEAR read of a
# partly-redundant channel, not in new information per se.
#
# ADDITIVITY IS THE OTHER READOUT. If (RT-only) + (licks-only) ~ combined, the
# blocks contribute independently. A shortfall means they interact -- plausible,
# since the mechanism analysis found RT predicts switching independent of reward
# while lick counts only predict it after an unrewarded trial.
#
# NOTE ON WIDTH: these arms are NARROWER than the combined arm (RT-only adds 1
# channel, licks-only 2, vs 3). Per the three-way grid the width cost is ~0 at
# D>=300 and -0.010 at D~10, so at small D these arms pay a SMALLER width penalty
# than the combined arm and are not directly comparable to it there. Compare each
# against OFF at matched D, and prefer the D>=100 cells for the decomposition.
#
# TIER: low priority + preemptible. Nothing else of ours is running, but these
# are priority 4 and should yield to anything launched after them.
#
# PRIMARY METRIC: heldout/final/eval_likelihood. Within-subject LL is a
# diagnostic only (train-eval gap) -- see the study README.

entity: AIND-disRNN
project: mice_rt_lick_scaling
name: h128-dscan-rt-only

method: grid
metric:
  name: heldout/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - model=gru_scaling
  - wandb.project=mice_rt_lick_scaling
  - model.architecture.hidden_size=128
  - model.architecture.session_encoding_type=scalar
  # lambda forward: pretrain 30k, warmup 30k->50k => full session conditioning at 50k.
  - model.architecture.session_n_pretrain_steps=30000
  - model.architecture.session_n_warmup_steps=20000
  - model.training.n_steps=150000
  - model.training.lr=1e-5
  - model.training.checkpoint_run_heldout_eval=false
  - model.training.length_bucketing=true
  # gated early stop: only arms at >=70k (20k after full lambda); catches post-SC overfit.
  - model.training.early_stopping.enabled=true
  - model.training.early_stopping.start_after_step=70000
  # single D cell for phase 0 (D~100: the cell with a tight study-01 bridge target)

  - data.timing_features.enabled=true
  - data.timing_features.reaction_time=true
  - data.timing_features.lick_counts=false
  - ${args_no_hyphens}

parameters:
  data.subject_ratio:
    values: [0.016, 0.049, 0.163, 0.489, 1.0]
  seed:
    values: [0, 1, 2]
