# Pinned analysis env for studies/07-gru-timing-inputs/ per docs/posthoc-analysis.md.
#
# The one line the analysis provenance depends on is the wrapper pin below:
# _meta.build_meta() parses `aind-disrnn-wrapper.git@<sha>` from this file and
# stamps it into every timing_scaling.json as _meta.wrapper_git_sha. That sha is
# the version of aind-disrnn-wrapper whose post_training_analysis produced the
# W&B held-out keys this study reads (see analysis/wandb_keys.py).
#
# 78b8d118 is the WRAPPER_REF that the last-scored arms (shuffled / RT-only /
# licks-only) were launched with -- it carries the timing-features module, the
# held-out-path fix (so heldout/final/eval_likelihood exists at all), the
# shuffle implementation, and the run-seed derivation fix. The earlier arms
# (ON / OFF) were launched at ancestor commits of the same branch; 78b8d118 is
# their descendant, so it is the single commit that can reproduce every arm.
#
# The analysis side (analysis/timing_scaling.py) needs only the Python stdlib +
# numpy + matplotlib; it talks to W&B over raw GraphQL (urllib), not the wandb
# SDK. The wrapper pin documents the PRODUCER of the metrics, not an import
# dependency of the analysis scripts.
#
# Producer (metrics-writing) wrapper commit:
