## Beaker task template for study 17's `pool-folds` variant (the same 4 fold models as the Cedar
## launches; Han, 2026-11-13: run on Beaker's allocated H200 slots while Cedar keeps trying).
## The resumable launcher keeps `command[:2]` and appends the sweep's `command:`. Run from the
## studies root:
##   python ../aind-dynamic-foraging-bfm-dispatcher/code/launch_beaker_resumable.py \
##     --sweep      "$PWD/studies/17-gru-crossfit-predictability/variants/pool-folds/sweep.yaml" \
##     --experiment "$PWD/studies/17-gru-crossfit-predictability/variants/pool-folds/experiment_beaker.yaml" \
##     --workspace  ai1/aind-dynamic-foraging-foundation-model \
##     --output-dir "$PWD/studies/17-gru-crossfit-predictability/variants/pool-folds/launch_record/<label>" \
##     --label <label> --note "..."

version: v2
description: study 17 pool-folds, 3-way GRU H256 fold models (template; the launcher rewrites this)
tasks:
  - name: pool-folds
    image:
      beaker: han-hou/dynamic-foraging-bfm-wrapper-main-20260902
    command:
      - bash
      - /workspace/aind-dynamic-foraging-bfm-wrapper/beaker/entrypoint.sh
      - "true"
    # Allocated (guaranteed) slots: never preempted.
    context:
      priority: normal
      preemptible: false
    constraints:
      cluster:
        # H200 141GB (H256 OOMs a 48GB L40S); on-prem reaches AWS S3 for the snapshot cache.
        - ai1/octo-hub-onprem-h200
    resources:
      # H256 at ~610 mice ran out of host memory at 256Gi on Cedar (folds-h256); give 384GiB.
      gpuCount: 1
      cpuCount: 16
      memory: 384GiB
    envVars:
      - name: WANDB_API_KEY
        secret: han-wandb-api-key
      - name: BFM_OUTPUT_DIR
        value: /results
      # Readable values; the launcher submits the resolved full SHAs.
      - name: WRAPPER_REF
        value: main
      - name: DISPATCHER_REF
        value: main
      - name: FORAGING_MODELS_REF
        value: main
    result:
      path: /results
