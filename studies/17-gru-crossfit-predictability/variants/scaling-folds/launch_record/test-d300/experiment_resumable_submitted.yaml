  - name: WRAPPER_REF
    value: 5affee531856d6eff31c9285e981c93747699efc
  - name: DISPATCHER_REF
    value: 7c1d686bd1d22457ab2d32ec144ecce1230eeb42
  - name: FORAGING_MODELS_REF
    value: 392c504406094b33407321b168173981b8af8291
