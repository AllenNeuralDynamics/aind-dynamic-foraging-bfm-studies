  - name: WANDB_RUN_ID
    value: scaling-folds-20261113-010520-5729f8ad
  - name: WANDB_RESUME
    value: allow
  - name: WANDB_RUN_GROUP
    value: scaling-folds@20261113-010520
  - name: BFM_META_STUDY
    value: 17-gru-crossfit-predictability
  - name: BFM_META_VARIANT
    value: scaling-folds
