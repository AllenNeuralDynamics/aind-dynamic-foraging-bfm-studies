version: v2
description: "scaling-folds@20261113-014533 \u2014 1 resumable grid tasks (autoResume)"
tasks:
- name: scaling-folds-20261113-014533-000
  image:
    beaker: han-hou/dynamic-foraging-bfm-wrapper-main-20260902
  command:
  - bash
  - /workspace/aind-dynamic-foraging-bfm-wrapper/beaker/entrypoint.sh
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
