## Beaker task template for study 17's `scaling-folds` variant, D=300 (pool folds and test fold), on-prem H200, normal priority.
## Han (2026-11-13): the 8 allocated seats take the longer runs (the 4 pool-folds models and the
## 4 D=100 models); D=10, 30 and 300 run preemptible and resume from checkpoints. Used by two
## launches: sweep_d300.yaml (pool folds 1-4) and sweep_test_d300.yaml (test fold).
## The resumable launcher keeps `command[:2]` and appends the sweep's `command:`. Run from the
## studies root:
##   python ../aind-dynamic-foraging-bfm-dispatcher/code/launch_beaker_resumable.py \
##     --sweep      "$PWD/studies/17-gru-crossfit-predictability/variants/scaling-folds/<sweep_d300|sweep_test_d300>.yaml" \
##     --experiment "$PWD/studies/17-gru-crossfit-predictability/variants/scaling-folds/experiment_beaker_d300.yaml" \
##     --workspace  ai1/aind-dynamic-foraging-foundation-model \
##     --output-dir "$PWD/studies/17-gru-crossfit-predictability/variants/scaling-folds/launch_record/<label>" \
##     --label <label> --note "..."

version: v2
description: study 17 scaling-folds, 3-way GRU H256, D=300 (pool folds and test fold), preemptible on on-prem H200 (template; the launcher rewrites this)
tasks:
  - name: scaling-folds-d300
    image:
      beaker: han-hou/dynamic-foraging-bfm-wrapper-main-20260902
    command:
      - bash
      - /workspace/aind-dynamic-foraging-bfm-wrapper/beaker/entrypoint.sh
      - "true"
    context:
      # Normal priority, not preemptible (Han, 2026-11-13): at low priority on the full on-prem
      # cluster these were evicted every 2-4 min by other workspaces' low-priority jobs.
      priority: normal
      preemptible: false
    constraints:
      cluster:
        # H200; reaches AWS S3 for the snapshot cache (GCP clusters cannot).
        - ai1/octo-hub-onprem-h200
    resources:
      # D ~ 300: host RAM between the D<=100 runs and the ~610-mouse runs (>320 GiB); take the
      # whole on-prem H200 bundle (1 GPU + 28 CPU + 378 GiB), not more, so each task gets 1 GPU.
      gpuCount: 1
      cpuCount: 28
      memory: 370GiB
    envVars:
      - name: WANDB_API_KEY
        secret: han-wandb-api-key-neuraldynamics   # han-hou (NeuralDynamics member); han-wandb-api-key (houhan) got W&B 403
      - name: BFM_OUTPUT_DIR
        value: /results
      # Readable values; the launcher submits the resolved full SHAs.
      - name: WRAPPER_REF
        value: main
      - name: DISPATCHER_REF
        value: main
      - name: FORAGING_MODELS_REF
        value: main
    result:
      path: /results
