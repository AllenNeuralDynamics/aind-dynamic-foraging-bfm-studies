## Beaker task template for study 17's `pool-folds-2way` variant: the 4 fold models as 2-way
## (ignore_policy exclude), H256. Normal priority, preemptible (the unallocated budget). Run from
## the studies root:
##   python ../aind-dynamic-foraging-bfm-dispatcher/code/launch_beaker_resumable.py \
##     --sweep      "$PWD/studies/17-gru-crossfit-predictability/variants/pool-folds-2way/sweep.yaml" \
##     --experiment "$PWD/studies/17-gru-crossfit-predictability/variants/pool-folds-2way/experiment_beaker.yaml" \
##     --workspace  ai1/aind-dynamic-foraging-foundation-model \
##     --output-dir "$PWD/studies/17-gru-crossfit-predictability/variants/pool-folds-2way/launch_record/<label>" \
##     --label <label> --note "..."

version: v2
description: study 17 pool-folds-2way, 2-way GRU H256 fold models (template; the launcher rewrites this)
tasks:
  - name: pool-folds-2way
    image:
      beaker: han-hou/dynamic-foraging-bfm-wrapper-main-20260902
    command:
      - bash
      - /workspace/aind-dynamic-foraging-bfm-wrapper/beaker/entrypoint.sh
      - "true"
    context:
      # Normal priority, preemptible (Han, 2026-11-13): the workspace's unallocated budget (~8 slots,
      # beaker-launch scheduling-lessons), above other workspaces' low-priority jobs; auto-resumes.
      # Low priority was evicted every 2-4 min on the full on-prem cluster; normal + not preemptible
      # only queues behind the allocated seats.
      priority: normal
      preemptible: true
    constraints:
      cluster:
        # H200 141GB (H256 OOMs a 48GB L40S); on-prem reaches AWS S3 for the snapshot cache.
        - ai1/octo-hub-onprem-h200
    resources:
      # One on-prem H200 bundle = 1 GPU + 28 CPU + 378 GiB (node: 8 GPU, 224 CPU, 3.0 TiB). Stay
      # inside it: 384GiB grabbed 2 GPUs per task (folds-h256-beaker). H256 at ~610 mice needs
      # more than 256Gi (Cedar folds-h256 OOM) and ran near 257 GiB at 320Gi on Cedar.
      gpuCount: 1
      cpuCount: 28
      memory: 370GiB
    envVars:
      - name: WANDB_API_KEY
        secret: han-wandb-api-key-neuraldynamics   # han-hou (NeuralDynamics member); han-wandb-api-key (houhan) got W&B 403
      - name: BFM_OUTPUT_DIR
        value: /results
      # Readable values; the launcher submits the resolved full SHAs.
      - name: WRAPPER_REF
        value: main
      - name: DISPATCHER_REF
        value: main
      - name: FORAGING_MODELS_REF
        value: main
    result:
      path: /results
