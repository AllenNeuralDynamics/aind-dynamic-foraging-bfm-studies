# Study 14 / lag-scan, L = 15 check: does the selection score turn down past the scan's cap?
# lag-scan@20261027-200129 peaked at its upper bound, L = 10, for both emissions. This adds
# L = 15 at K = 1, otherwise identical to sweep_hpc.yaml apart from num_workers (refits only).
# Original header:
# Study 14 / lag-scan: K = 1 on the full training pool, every history length L for both
# emissions, to fix L for the K grids (PLAN.md). L is chosen on glmhmm/select/eval_likelihood,
# the per-mouse refit score of the TRAINING mice; held-out keys are reported but never used
# to choose. At K = 1 there are no restarts.
#   data  -> dispatcher code/config/data/mice_snapshot_scaling.yaml (snapshot 20260603),
#            ignore_policy=include as study 02's 3-way GRU, stage column retained for the split
#   model -> dispatcher code/config/model/glmhmm.yaml
# wandb.project must be in the command: the launcher sets only the group.

entity: AIND-disRNN
project: mice_glmhmm
name: lag-scan

method: grid
metric:
  name: glmhmm/select/eval_likelihood
  goal: maximize

command:
  - python
  - -m
  - run_hpc
  - data=mice_snapshot_scaling
  - data.ignore_policy=include
  - +data.cols_to_retain=[trial,subject_id,ses_idx,animal_response,earned_reward,current_stage_actual]
  - model=glmhmm
  - model.num_states=1
  - model.num_workers=10  # per-subject refits 10 at a time; needs --cpus-per-task=32
  - seed=0
  - wandb.entity=AIND-disRNN
  - wandb.project=mice_glmhmm
  - ${args_no_hyphens}

parameters:
  model.emission:
    values: [hurdle, reference]
  model.n_lags:
    values: [15]  # past the original cap of 10, to see whether longer histories overfit
